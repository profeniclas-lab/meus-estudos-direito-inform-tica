<!DOCTYPE html>

        .btn {

            padding: 0.6rem 1rem; border-radius: var(--radius); border: 1px solid transparent;
            font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.9rem;
            width: 100%; margin-bottom: 0.5rem;

        .btn-primary { background: var(--primary); color: white; }

        .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }

        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }

        .stat-box {

        .stat-label { font-size: 0.8rem; color: var(--text-muted); }
        .module-item {

            padding: 0.75rem; border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .module-item:last-child { border-bottom: none; }
        .module-item:hover { background: var(--bg); }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
        .badge-alta { background: #fee2e2; color: #991b1b; }
        .badge-media { background: #fef3c7; color: #92400e; }
        .badge-baixa { background: #e0e7ff; color: #3730a3; }
        .hidden { display: none !important; }
        #toast {
            position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius);
            font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200;
        }
        #toast.show { opacity: 1; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-input-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        .lesson-section { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px dashed var(--border); }
        .lesson-section:last-child { border-bottom: none; }
        .lesson-section h3 { color: var(--primary); font-size: 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }

        .trap-box { background: #fef3c7; border-left: 4px solid var(--warning); padding: 0.75rem 1rem; border-radius: 0 var(--radius) var(--radius) 0; margin: 0.75rem 0; font-size: 0.9rem; }
        .error-box { background: #fee2e2; border-left: 4px solid var(--danger); padding: 0.75rem 1rem; border-radius: 0 var(--radius) var(--radius) 0; margin: 0.75rem 0; font-size: 0.9rem; }
        .success-box { background: #dcfce7; border-left: 4px solid var(--success); padding: 0.75rem 1rem; border-radius: 0 var(--radius) var(--radius) 0; margin: 0.75rem 0; font-size: 0.9rem; }

        .teacher-buttons button.active { background: #8b5cf6; color: white; border-color: #8b5cf6; }
        .teacher-content { display: none; padding: 1rem; background: white; border-radius: var(--radius); margin-top: 0.5rem; font-size: 0.9rem; }
        .teacher-content.visible { display: block; }
        .recovery-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.75rem; }
        .recovery-question { font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .recovery-answer { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #dcfce7; border-radius: var(--radius); font-size: 0.9rem; }
        .recovery-answer.visible { display: block; }
        .recovery-btn { font-size: 0.8rem; padding: 0.4rem 0.8rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); cursor: pointer; }
        .lesson-nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }

        .diag-progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; margin-bottom: 1rem; overflow: hidden; }
        .diag-progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.4s ease; }
        .diag-step-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; text-align: center; }
        .diag-type-badge { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; margin-bottom: 0.75rem; }
        .diag-type-multipla { background: #dbeafe; color: #1e40af; }
        .diag-type-vf { background: #fef3c7; color: #92400e; }
        .diag-type-situacao { background: #ede9fe; color: #5b21b6; }
        .diag-type-auto { background: #dcfce7; color: #166534; }
        .diag-question-text { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.5; }
        .diag-situation-context { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: var(--radius); padding: 0.75rem; margin-bottom: 1rem; font-size: 0.9rem; font-style: italic; }
        .diag-alternatives { display: flex; flex-direction: column; gap: 0.5rem; }
        .diag-alt-btn { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.2s; text-align: left; font-size: 0.95rem; width: 100%; }
        .diag-alt-btn:hover { border-color: var(--primary); background: #eff6ff; }
        .diag-alt-btn.selected { border-color: var(--primary); background: #dbeafe; font-weight: 600; }
        .diag-alt-btn.correct { border-color: var(--success); background: #dcfce7; }
        .diag-alt-btn.wrong { border-color: var(--danger); background: #fee2e2; }
        .diag-alt-letter { min-width: 28px; height: 28px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
        .diag-alt-btn.selected .diag-alt-letter { background: var(--primary); color: white; }
        .diag-alt-btn.correct .diag-alt-letter { background: var(--success); color: white; }
        .diag-alt-btn.wrong .diag-alt-letter { background: var(--danger); color: white; }
        .diag-vf-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .diag-vf-btn { padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 1rem; font-weight: 700; text-align: center; transition: all 0.2s; }
        .diag-vf-btn:hover { border-color: var(--primary); }
        .diag-vf-btn.selected-v { border-color: var(--success); background: #dcfce7; color: var(--success); }
        .diag-vf-btn.selected-f { border-color: var(--danger); background: #fee2e2; color: var(--danger); }
        .diag-vf-btn.correct { border-color: var(--success); background: #dcfce7; }
        .diag-vf-btn.wrong { border-color: var(--danger); background: #fee2e2; }
        .diag-auto-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .diag-auto-btn { padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 0.95rem; font-weight: 600; text-align: center; transition: all 0.2s; }
        .diag-auto-btn:hover { border-color: var(--primary); }
        .diag-auto-btn.selected { border-color: var(--primary); background: #dbeafe; }
        .diag-feedback { margin-top: 1rem; padding: 1rem; border-radius: var(--radius); font-size: 0.9rem; display: none; }

        .diag-feedback.correct { background: #dcfce7; border: 1px solid #86efac; }
        .diag-feedback.wrong { background: #fee2e2; border: 1px solid #fca5a5; }
        .diag-feedback.neutral { background: #eff6ff; border: 1px solid #93c5fd; }
        .diag-result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
        .diag-result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .diag-score-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: white; }

        .diag-score-medium { background: var(--warning); }
        .diag-score-bad { background: var(--danger); }
        .diag-subtopic-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .diag-subtopic-bar .bar-bg { flex: 1; height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; }

        .diag-subtopic-label { min-width: 120px; font-weight: 600; }
        .diag-subtopic-value { min-width: 40px; text-align: right; font-weight: 600; }

        .diag-tag-strength { background: #dcfce7; color: #166534; }
        .diag-tag-weakness { background: #fee2e2; color: #991b1b; }
        .diag-tag-neutral { background: #f1f5f9; color: #475569; }

        .quiz-progress-text { font-size: 0.85rem; color: var(--text-muted); }
        .quiz-filters {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .quiz-filter-select {
            padding: 0.5rem; border: 1px solid var(--border); border-radius: var(--radius);
            font-size: 0.9rem; background: var(--surface);
        }
        .quiz-question-card {
            background: var(--surface); border: 1px solid var(--border);

        .quiz-type-badge {
            display: inline-block; font-size: 0.7rem; padding: 2px 8px;

        .quiz-type-real { background: #fef3c7; color: #92400e; }
        .quiz-type-didatica { background: #dbeafe; color: #1e40af; }
        .quiz-statement {
            font-size: 1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.5;

        .quiz-alternatives { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
        .quiz-alt-btn {
            display: flex; align-items: flex-start; gap: 0.75rem;
            padding: 0.75rem 1rem; background: var(--surface);
            border: 2px solid var(--border); border-radius: var(--radius);
            cursor: pointer; transition: all 0.2s; text-align: left;
            font-size: 0.95rem; width: 100%;
        }
        .quiz-alt-btn:hover:not(.disabled) { border-color: var(--primary); background: #eff6ff; }
        .quiz-alt-btn.selected { border-color: var(--primary); background: #dbeafe; font-weight: 600; }
        .quiz-alt-btn.correct { border-color: var(--success); background: #dcfce7; }
        .quiz-alt-btn.wrong { border-color: var(--danger); background: #fee2e2; }
        .quiz-alt-btn.disabled { pointer-events: none; opacity: 0.7; }
        .quiz-alt-letter {
            min-width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg); display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 0.85rem;
            flex-shrink: 0;
        }
        .quiz-alt-btn.selected .quiz-alt-letter { background: var(--primary); color: white; }
        .quiz-alt-btn.correct .quiz-alt-letter { background: var(--success); color: white; }
        .quiz-alt-btn.wrong .quiz-alt-letter { background: var(--danger); color: white; }
        .quiz-feedback {
            margin-top: 1rem; padding: 1rem; border-radius: var(--radius);
            font-size: 0.9rem; display: none;
        }
        .quiz-feedback.visible { display: block; }
        .quiz-feedback.correct { background: #dcfce7; border: 1px solid #86efac; }
        .quiz-feedback.wrong { background: #fee2e2; border: 1px solid #fca5a5; }
        .quiz-feedback-section {
            margin-top: 0.75rem; padding-top: 0.75rem;
            border-top: 1px dashed var(--border);
        }
        .quiz-feedback-section:first-child { border-top: none; margin-top: 0; padding-top: 0; }
        .quiz-feedback-section strong { display: block; margin-bottom: 0.25rem; color: var(--text); }
        .quiz-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
        .quiz-empty {
            text-align: center; padding: 2rem; color: var(--text-muted);
        }
        .quiz-empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    </style>
</head>

    <main id="app-container"></main>

        const Storage = {
            KEY_STATE: "admin-dir:state:v1",
            load() {
                try { const raw = localStorage.getItem(this.KEY_STATE); if (raw) return JSON.parse(raw); }
                catch (e) { console.error("Erro ao carregar:", e); }
                return null;
            },
            save(state) {
                try { localStorage.setItem(this.KEY_STATE, JSON.stringify(state)); }
                catch (e) { console.error("Erro ao salvar:", e); UI.toast("Erro ao salvar."); }
            },
            exportData(state) {
                const a = document.createElement('a');
                a.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2)));
                a.setAttribute("download", "admin-dir-backup-" + new Date().toISOString().slice(0,10) + ".json");
                document.body.appendChild(a); a.click(); a.remove();
                UI.toast("Backup exportado!");
            },
            importData(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imp = JSON.parse(e.target.result);
                        if (imp && imp.version) { Storage.save(imp); UI.toast("Importado!"); setTimeout(() => location.reload(), 1500); }
                        else throw new Error("Inválido");
                    } catch (err) { UI.toast("Arquivo inválido."); }
                };
                reader.readAsText(file);
            }
        };

        let AppState = {
            version: "0.4", schema: 1,
            createdAt: new Date().toISOString(), lastAccess: new Date().toISOString(),
            progress: { modules: {}, questionsAnswered: 0, questionsCorrect: 0, questionLog: [] },
            errors: {}, reviews: {},
            diagnosis: {},
            settings: { theme: "light", dailyGoal: 20 }
        };

        const State = {
            init() {
                const saved = Storage.load();
                if (saved && saved.schema === AppState.schema) { AppState = { ...AppState, ...saved }; }
                else { Storage.save(AppState); }
                AppState.lastAccess = new Date().toISOString();
                Storage.save(AppState);
            },
            save() { AppState.lastAccess = new Date().toISOString(); Storage.save(AppState); },
            reset() {
                if (confirm("ATENÇÃO: Isso apagará TODO o seu progresso.\n\nDeseja continuar?")) {
                    localStorage.removeItem(Storage.KEY_STATE);
                    UI.toast("Resetado.");
                    setTimeout(() => location.reload(), 1000);
                }
            },
            markLessonViewed(moduleId) {
                if (!AppState.progress.modules[moduleId]) {
                    AppState.progress.modules[moduleId] = { status: "em_andamento", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                }
                AppState.progress.modules[moduleId].lessonViewed = true;
                AppState.progress.modules[moduleId].lastAccess = new Date().toISOString();
                State.save();
            },
            saveDiagnosis(moduleId, results, strengths, weaknesses, recommendation) {
                AppState.diagnosis[moduleId] = {
                    doneAt: new Date().toISOString(),
                    results: results,
                    strengths: strengths,
                    weaknesses: weaknesses,
                    recommendation: recommendation
                };
                if (!AppState.progress.modules[moduleId]) {
                    AppState.progress.modules[moduleId] = { status: "diagnostico", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                }
                AppState.progress.modules[moduleId].diagnosisDone = true;
                AppState.progress.modules[moduleId].status = "em_andamento";
                State.save();
            },
            recordQuestionAnswer(questionId, userAnswer, correct, context = 'quiz') {
                const logEntry = {
                    questionId: questionId,
                    userAnswer: userAnswer,
                    correct: correct,
                    timestamp: new Date().toISOString(),
                    context: context
                };
                AppState.progress.questionLog.push(logEntry);
                AppState.progress.questionsAnswered++;
                if (correct) AppState.progress.questionsCorrect++;

                const question = Data.questions.find(q => q.id === questionId);
                if (question && question.moduleId) {
                    if (!AppState.progress.modules[question.moduleId]) {
                        AppState.progress.modules[question.moduleId] = { status: "em_andamento", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                    }
                    AppState.progress.modules[question.moduleId].questionsAnswered++;
                    if (correct) AppState.progress.modules[question.moduleId].questionsCorrect++;
                    AppState.progress.modules[question.moduleId].lastAccess = new Date().toISOString();
                }

                if (!correct && question) {
                    if (!AppState.errors[questionId]) {
                        AppState.errors[questionId] = {
                            questionId: questionId,
                            userAnswer: userAnswer,
                            correctAnswer: question.answer,
                            count: 1,
                            lastAttempt: new Date().toISOString(),
                            nextReview: new Date(Date.now() + 1 * 24 * 60 * 60 * 1000).toISOString(),
                            resolved: false
                        };
                    } else {
                        AppState.errors[questionId].count++;
                        AppState.errors[questionId].lastAttempt = new Date().toISOString();
                        AppState.errors[questionId].nextReview = new Date(Date.now() + 1 * 24 * 60 * 60 * 1000).toISOString();
                    }

                    AppState.reviews[questionId] = {
                        type: "error",
                        itemId: questionId,
                        intervalLevel: 1,
                        nextReview: new Date(Date.now() + 1 * 24 * 60 * 60 * 1000).toISOString(),
                        easeFactor: 2.0
                    };
                }

                State.save();
            }
        };

                            ${hasDiag ? `<button class="btn ${diagDone ? 'btn-outline' : 'btn-primary'}" onclick="Router.navigate('diagnosis','${moduleId}')">${diagDone ? '🔄 Refazer Diagnóstico' : '📝 Fazer Diagnóstico Inicial'}</button>` : ''}
                            ${hasLesson ? `<button class="btn btn-outline" onclick="Router.navigate('lesson','${moduleId}')">📖 Ler Aula Teórica</button>` : ''}

                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button>

                    </div>
                    <div class="card">
                        <div class="lesson-section"><h3>🎯 Objetivo</h3><p>${lesson.objective}</p></div>

                        <div class="lesson-section"><h3>🏛️ Aplicação Pública</h3><div class="highlight-box">${lesson.publicAdminApplication}</div></div>
                        <div class="lesson-section"><h3>🎯 Pegadinhas</h3>${lesson.traps.map(t=>`<div class="trap-box">⚠️ ${t}</div>`).join('')}</div>
                        <div class="lesson-section"><h3>⚠️ Erros Comuns</h3>${lesson.commonErrors.map(e=>`<div class="error-box">❌ ${e}</div>`).join('')}</div>
                        <div class="lesson-section"><h3>📝 Resumo</h3><div class="success-box">${lesson.summary.replace(/\n/g,'<br>')}</div></div>
                        <div class="lesson-section"><h3>👨‍🏫 Modo Professor</h3><div class="teacher-mode"><div class="teacher-buttons"><button onclick="UI.toggleTeacher('s-${moduleId}',this)">🧒 Simples</button><button onclick="UI.toggleTeacher('e-${moduleId}',this)">💡 Exemplos</button><button onclick="UI.toggleTeacher('x-${moduleId}',this)">🎓 Concurso</button></div><div id="s-${moduleId}" class="teacher-content">${lesson.simpleExplanation}</div><div id="e-${moduleId}" class="teacher-content"><ul>${lesson.moreExamples.map(e=>`<li>${e}</li>`).join('')}</ul></div><div id="x-${moduleId}" class="teacher-content">${lesson.examFocus.replace(/\n/g,'<br>')}</div></div></div>
                        <div class="lesson-section"><h3>🧠 Recuperação Ativa</h3>${lesson.activeRecovery.map((r,i)=>`<div class="recovery-card"><div class="recovery-question">${i+1}. ${r.question}</div><button class="recovery-btn" onclick="UI.toggleRecovery('rc-${moduleId}-${i}',this)">Revelar</button><div id="rc-${moduleId}-${i}" class="recovery-answer">${r.answer}</div></div>`).join('')}</div>
                    </div>`;
            },
            renderDiagnosis(moduleId) {
                const diag = Data.diagnosis[moduleId];
                if (!diag) return `<div class="card"><h2>Diagnóstico não disponível</h2></div>`;
                UI.diagState.moduleId = moduleId;
                UI.diagState.step = 0;
                UI.diagState.answers = {};
                UI.diagState.showingFeedback = false;
                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button>
                        <h2>📝 ${diag.title}</h2>
                        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1rem;">${diag.description}</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">Total: <strong>${diag.questions.length}</strong></p>
                        <button class="btn btn-primary" onclick="UI.startDiagnosis()">Iniciar Diagnóstico</button>
                    </div>`;
            },
            startDiagnosis() {
                UI.diagState.step = 0;
                UI.diagState.answers = {};
                UI.diagState.showingFeedback = false;
                UI.renderDiagQuestion();
            },
            renderDiagQuestion() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                const q = diag.questions[UI.diagState.step];
                const total = diag.questions.length;
                const step = UI.diagState.step + 1;
                const pct = Math.round((UI.diagState.step / total) * 100);
                UI.diagState.showingFeedback = false;
                const typeLabels = { 'multipla_escolha': '<span class="diag-type-badge diag-type-multipla">Múltipla Escolha</span>', 'verdadeiro_falso': '<span class="diag-type-badge diag-type-vf">Verdadeiro ou Falso</span>', 'situacao': '<span class="diag-type-badge diag-type-situacao">Situação Prática</span>', 'autoavaliacao': '<span class="diag-type-badge diag-type-auto">Autoavaliação</span>' };
                let questionHtml = '';
                if (q.type === 'multipla_escolha' || q.type === 'situacao') {
                    questionHtml = `${q.situation ? `<div class="diag-situation-context">📋 ${q.situation}</div>` : ''}<div class="diag-question-text">${q.statement}</div><div class="diag-alternatives" id="diag-alts">${q.alternatives.map(a => `<button class="diag-alt-btn" data-id="${a.id}" onclick="UI.selectDiagAlt('${a.id}')"><span class="diag-alt-letter">${a.id}</span><span>${a.text}</span></button>`).join('')}</div><div id="diag-feedback" class="diag-feedback"></div><button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">${step < total ? 'Próxima →' : 'Ver Resultado →'}</button>`;
                } else if (q.type === 'verdadeiro_falso') {
                    questionHtml = `<div class="diag-question-text">${q.statement}</div><div class="diag-vf-buttons" id="diag-vf-btns"><button class="diag-vf-btn" data-val="true" onclick="UI.selectDiagVF(true)">✅ VERDADEIRO</button><button class="diag-vf-btn" data-val="false" onclick="UI.selectDiagVF(false)">❌ FALSO</button></div><div id="diag-feedback" class="diag-feedback"></div><button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">${step < total ? 'Próxima →' : 'Ver Resultado →'}</button>`;
                } else if (q.type === 'autoavaliacao') {
                    questionHtml = `<div class="diag-question-text">${q.statement}</div><div class="diag-auto-buttons" id="diag-auto-btns"><button class="diag-auto-btn" onclick="UI.selectDiagAuto(true)">✅ Eu já sabia</button><button class="diag-auto-btn" onclick="UI.selectDiagAuto(false)">❌ Eu não sabia</button></div><button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">${step < total ? 'Próxima →' : 'Ver Resultado →'}</button>`;
                }
                document.getElementById('app-container').innerHTML = `<div class="card"><button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Sair</button><div class="diag-progress-bar"><div class="diag-progress-fill" style="width:${pct}%"></div></div><div class="diag-step-info">Pergunta ${step} de ${total} • ${q.subtopicName}</div>${typeLabels[q.type]}${questionHtml}</div>`;
            },
            selectDiagAlt(altId) {
                if (UI.diagState.showingFeedback) return;
                UI.diagState.showingFeedback = true;
                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                const isCorrect = altId === q.answer;
                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: isCorrect, userAnswer: altId };
                document.querySelectorAll('.diag-alt-btn').forEach(btn => { btn.style.pointerEvents = 'none'; if (btn.dataset.id === q.answer) btn.classList.add('correct'); else if (btn.dataset.id === altId && !isCorrect) btn.classList.add('wrong'); });
                const fb = document.getElementById('diag-feedback');
                fb.className = `diag-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                fb.innerHTML = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou.'}</strong><br>${q.explanation}`;
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },
            selectDiagVF(val) {
                if (UI.diagState.showingFeedback) return;
                UI.diagState.showingFeedback = true;
                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                const isCorrect = val === q.answer;
                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: isCorrect, userAnswer: val };
                document.querySelectorAll('.diag-vf-btn').forEach(btn => { btn.style.pointerEvents = 'none'; const btnVal = btn.dataset.val === 'true'; if (btnVal === q.answer) btn.classList.add('correct'); else if (btnVal === val && !isCorrect) btn.classList.add('wrong'); });
                const fb = document.getElementById('diag-feedback');
                fb.className = `diag-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                fb.innerHTML = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou.'}</strong><br>${q.explanation}`;
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },
            selectDiagAuto(knew) {
                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: null, selfKnown: knew };
                document.querySelectorAll('.diag-auto-btn').forEach(btn => { btn.style.pointerEvents = 'none'; });
                event.target.classList.add('selected');
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },
            nextDiagStep() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                UI.diagState.step++;
                if (UI.diagState.step >= diag.questions.length) { UI.renderDiagResult(); } else { UI.renderDiagQuestion(); }
            },
            renderDiagResult() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                const answers = UI.diagState.answers;
                const subtopics = {};
                let totalObjective = 0, correctObjective = 0, totalSelfKnown = 0, selfKnownCount = 0;
                Object.values(answers).forEach(a => {
                    if (!subtopics[a.subtopic]) { const q = diag.questions.find(qq => qq.subtopic === a.subtopic); subtopics[a.subtopic] = { name: q ? q.subtopicName : a.subtopic, total: 0, correct: 0, selfKnown: 0, selfTotal: 0 }; }
                    const st = subtopics[a.subtopic];
                    if (a.type === 'autoavaliacao') { st.selfTotal++; if (a.selfKnown) { st.selfKnown++; selfKnownCount++; } totalSelfKnown++; } else { st.total++; totalObjective++; if (a.correct) { st.correct++; correctObjective++; } }
                });
                const pct = totalObjective > 0 ? Math.round((correctObjective / totalObjective) * 100) : 0;
                const strengths = []; const weaknesses = [];
                Object.entries(subtopics).forEach(([key, st]) => { const stPct = st.total > 0 ? (st.correct / st.total) * 100 : (st.selfKnown > 0 ? 100 : 50); if (stPct >= 75) strengths.push(st.name); else if (stPct < 50) weaknesses.push(st.name); });
                let recommendation = '';
                if (pct >= 80 && weaknesses.length === 0) { recommendation = '🟢 Excelente! Pode avançar para a aula.'; } else if (pct >= 50) { recommendation = '🟡 Bom começo! Reforce os pontos fracos.'; } else { recommendation = '🔴 Este módulo precisa de atenção. Estude a aula teórica.'; }
                State.saveDiagnosis(moduleId, subtopics, strengths, weaknesses, recommendation);
                const scoreClass = pct >= 75 ? 'diag-score-good' : pct >= 50 ? 'diag-score-medium' : 'diag-score-bad';
                let html = `<div class="card"><h2>📊 Resultado do Diagnóstico</h2><p style="color:var(--text-muted);font-size:0.9rem;">${diag.title}</p></div><div class="diag-result-card"><div class="diag-result-header"><div><div style="font-size:0.85rem;color:var(--text-muted);">Desempenho</div><div style="font-size:1.5rem;font-weight:700;">${correctObjective}/${totalObjective} (${pct}%)</div></div><div class="diag-score-circle ${scoreClass}">${pct}%</div></div></div><div class="diag-result-card"><h3 style="margin-bottom:0.75rem;">💡 Recomendação</h3><p style="font-size:0.95rem;">${recommendation}</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;"><button class="btn btn-outline" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button><button class="btn btn-primary" onclick="Router.navigate('lesson','${moduleId}')">📖 Ir para a Aula</button></div>`;
                document.getElementById('app-container').innerHTML = html;
                window.scrollTo(0, 0);
            },
            quizState: { moduleId: null, questions: [], currentIndex: 0, answered: false },
            renderQuiz(moduleId) {
                const mod = Data.modules.find(m => m.id === moduleId);
                if (!mod) return `<div class="card"><h2>Módulo não encontrado</h2></div>`;
                const moduleQuestions = Data.questions.filter(q => q.moduleId === moduleId);
                if (moduleQuestions.length === 0) {
                    return `<div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button>
                        <h2>⚔️ Questões — ${mod.title}</h2>
                        <div class="quiz-empty">
                            <div class="quiz-empty-icon">📝</div>
                            <p style="font-size:1.1rem;font-weight:600;margin-bottom:0.5rem;">Nenhuma questão disponível</p>
                            <p style="font-size:0.9rem;">Em breve novas questões serão adicionadas.</p>
                        </div>
                    </div>`;
                }
                UI.quizState.moduleId = moduleId;
                UI.quizState.questions = moduleQuestions;
                UI.quizState.currentIndex = 0;
                UI.quizState.answered = false;
                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button>
                        <h2>⚔️ Questões — ${mod.title}</h2>
                        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1rem;">Total: <strong>${moduleQuestions.length}</strong></p>
                        <div class="quiz-filters">
                            <select class="quiz-filter-select" id="quiz-filter-difficulty" onchange="UI.applyQuizFilters()">
                                <option value="all">Todas as dificuldades</option>
                                <option value="1">Fácil</option>
                                <option value="2">Médio</option>
                                <option value="3">Difícil</option>
                            </select>
                            <select class="quiz-filter-select" id="quiz-filter-type" onchange="UI.applyQuizFilters()">
                                <option value="all">Todos os tipos</option>
                                <option value="REAL">Questões Reais</option>
                                <option value="DIDATICA">Questões Didáticas</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="UI.startQuiz()">Iniciar Prática</button>
                    </div>`;
            },
            applyQuizFilters() {
                const moduleId = UI.quizState.moduleId;
                const difficulty = document.getElementById('quiz-filter-difficulty').value;
                const type = document.getElementById('quiz-filter-type').value;
                let filtered = Data.questions.filter(q => q.moduleId === moduleId);
                if (difficulty !== 'all') filtered = filtered.filter(q => q.difficulty == difficulty);
                if (type !== 'all') filtered = filtered.filter(q => q.type === type);
                UI.quizState.questions = filtered;
            },
            startQuiz() {
                if (UI.quizState.questions.length === 0) {
                    UI.toast("Nenhuma questão disponível com os filtros selecionados.");
                    return;
                }
                UI.quizState.currentIndex = 0;
                UI.quizState.answered = false;
                UI.renderQuizQuestion();
            },
            renderQuizQuestion() {
                const q = UI.quizState.questions[UI.quizState.currentIndex];
                const total = UI.quizState.questions.length;
                const current = UI.quizState.currentIndex + 1;
                const moduleId = UI.quizState.moduleId;
                UI.quizState.answered = false;
                const typeBadge = q.type === 'REAL'
                    ? '<span class="quiz-type-badge quiz-type-real">Questão Real</span>'
                    : '<span class="quiz-type-badge quiz-type-didatica">Questão Didática</span>';
                document.getElementById('app-container').innerHTML = `
                    <div class="card">
                        <div class="quiz-header">
                            <button class="btn btn-outline" style="width:auto;padding:0.4rem 0.8rem;margin:0;" onclick="Router.navigate('topic','${moduleId}')">← Sair</button>
                            <div class="quiz-progress-text">Questão ${current} de ${total}</div>
                        </div>
                        ${typeBadge}
                        <div class="quiz-statement">${q.statement}</div>
                        <div class="quiz-alternatives" id="quiz-alts">
                            ${q.alternatives.map(a => `
                                <button class="quiz-alt-btn" data-id="${a.id}" onclick="UI.selectQuizAlt('${a.id}')">
                                    <span class="quiz-alt-letter">${a.id}</span>
                                    <span>${a.text}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div id="quiz-feedback" class="quiz-feedback"></div>
                        <div class="quiz-actions">
                            <button id="quiz-prev-btn" class="btn btn-outline ${current === 1 ? 'hidden' : ''}" onclick="UI.prevQuizQuestion()">← Anterior</button>
                            <button id="quiz-next-btn" class="btn btn-primary hidden" onclick="UI.nextQuizQuestion()">${current < total ? 'Próxima →' : 'Finalizar'}</button>
                        </div>
                    </div>`;
            },
            selectQuizAlt(altId) {
                if (UI.quizState.answered) return;
                UI.quizState.answered = true;
                const q = UI.quizState.questions[UI.quizState.currentIndex];
                const isCorrect = altId === q.answer;
                State.recordQuestionAnswer(q.id, altId, isCorrect, 'quiz');
                document.querySelectorAll('.quiz-alt-btn').forEach(btn => {
                    btn.classList.add('disabled');
                    if (btn.dataset.id === q.answer) btn.classList.add('correct');
                    else if (btn.dataset.id === altId && !isCorrect) btn.classList.add('wrong');
                });
                const fb = document.getElementById('quiz-feedback');
                fb.className = `quiz-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                let feedbackHtml = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou. Resposta correta: ' + q.answer + '.'}</strong>`;
                if (q.explanation) {
                    feedbackHtml += `<div class="quiz-feedback-section"><strong>💡 Por que ${q.answer} está correta?</strong>${q.explanation.correct}</div>`;
                    if (!isCorrect && q.explanation.wrong) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>❌ Por que as outras estão erradas?</strong>`;
                        Object.entries(q.explanation.wrong).forEach(([alt, exp]) => {
                            feedbackHtml += `<div style="margin-top:0.25rem;"><strong>${alt}):</strong> ${exp}</div>`;
                        });
                        feedbackHtml += `</div>`;
                    }
                    if (q.explanation.concept) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>📚 Conceito:</strong> ${q.explanation.concept}</div>`;
                    }
                    if (q.explanation.trap) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>⚠️ Pegadinha:</strong> ${q.explanation.trap}</div>`;
                    }
                    if (q.explanation.examTip) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>🎓 Dica:</strong> ${q.explanation.examTip}</div>`;
                    }
                }
                fb.innerHTML = feedbackHtml;
                document.getElementById('quiz-next-btn').classList.remove('hidden');
            },
            prevQuizQuestion() {
                if (UI.quizState.currentIndex > 0) {
                    UI.quizState.currentIndex--;
                    UI.renderQuizQuestion();
                }
            },
            nextQuizQuestion() {
                const total = UI.quizState.questions.length;
                if (UI.quizState.currentIndex < total - 1) {
                    UI.quizState.currentIndex++;
                    UI.renderQuizQuestion();
                } else {
                    UI.toast("Quiz finalizado!");
                    Router.navigate('topic', UI.quizState.moduleId);
                }
            },
            toggleTeacher(id, btn) {
                const el = document.getElementById(id);
                const vis = el.classList.contains('visible');
                document.querySelectorAll('.teacher-content').forEach(c => c.classList.remove('visible'));
                document.querySelectorAll('.teacher-buttons button').forEach(b => b.classList.remove('active'));
                if (!vis) { el.classList.add('visible'); btn.classList.add('active'); }
            },
            toggleRecovery(id, btn) {
                const el = document.getElementById(id);
                el.classList.toggle('visible');
                btn.textContent = el.classList.contains('visible') ? 'Ocultar' : 'Revelar';
            },
            renderSettings() {
                return `
                    <div class="card">
                        <h2>⚙️ Configurações e Backup</h2>
                        <button class="btn btn-outline" onclick="Storage.exportData(AppState)">⬇️ Exportar Progresso</button>
                        <div class="file-input-wrapper"><button class="btn btn-outline">⬆️ Importar Progresso</button><input type="file" accept=".json" onchange="Storage.importData(this.files[0])"></div>
                        <h3 style="margin-top:1.5rem;color:var(--danger);">Zona de Perigo</h3>
                        <button class="btn btn-danger" onclick="App.resetData()">🗑️ Resetar Todos os Dados</button>
                    </div>
                    <div class="card"><h3>Sobre</h3><p style="font-size:0.85rem;color:var(--text-muted);"><strong>ADMIN-DIR</strong><br>Versão: 0.4 (Fase 4)<br>Single-File Offline</p></div>`;
            }
        };

        const Router = {
            currentRoute: 'dashboard',
            navigate(route, param = null) {
                this.currentRoute = route;
                const container = document.getElementById('app-container');
                document.querySelectorAll('nav.bottom-nav button').forEach(btn => btn.classList.remove('active'));
                const navBtn = document.getElementById(`nav-${['topic','lesson','diagnosis','quiz'].includes(route) ? 'modules' : route}`);
                if (navBtn) navBtn.classList.add('active');
                window.scrollTo(0, 0);
                switch(route) {
                    case 'dashboard': container.innerHTML = UI.renderDashboard(); break;
                    case 'modules': container.innerHTML = UI.renderModules(); break;
                    case 'topic': container.innerHTML = UI.renderTopic(param); break;
                    case 'lesson': container.innerHTML = UI.renderLesson(param); break;
                    case 'diagnosis': container.innerHTML = UI.renderDiagnosis(param); break;
                    case 'quiz': container.innerHTML = UI.renderQuiz(param); break;
                    case 'settings': container.innerHTML = UI.renderSettings(); break;
                    default: container.innerHTML = UI.renderDashboard();
                }
            }
        };

        const App = {
            init() {
                State.init();
                document.getElementById('app-version').textContent = `v${AppState.version}`;
                Router.navigate('dashboard');
                console.log("ADMIN-DIR v0.4 inicializado.");
            },
            resetData() { State.reset(); }
        };
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
