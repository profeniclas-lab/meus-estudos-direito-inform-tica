            max-width: 800px; margin: 0 auto; width: 100%;
        }

        .card h3 { font-size: 1rem; margin-bottom: 0.5rem; color: var(--text-muted); }

        .badge-baixa { background: #e0e7ff; color: #3730a3; }

            background: #1e293b; color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius);
            font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200;
        }
        #toast.show { opacity: 1; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }

        .lesson-section { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px dashed var(--border); }

        .trap-box { background: #fef3c7; border-left: 4px solid var(--warning); padding: 0.75rem 1rem; border-radius: 0 var(--radius) var(--radius) 0; margin: 0.75rem 0; font-size: 0.9rem; }
        .error-box { background: #fee2e2; border-left: 4px solid var(--danger); padding: 0.75rem 1rem; border-radius: 0 var(--radius) var(--radius) 0; margin: 0.75rem 0; font-size: 0.9rem; }

        .lesson-nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }

        /* =========================================
           ESTILOS DO DIAGNÓSTICO (FASE 3)
           ========================================= */
        .diag-progress-bar {
            width: 100%; height: 8px; background: var(--border);
            border-radius: 4px; margin-bottom: 1rem; overflow: hidden;
        }
        .diag-progress-fill {
            height: 100%; background: var(--primary);
            border-radius: 4px; transition: width 0.4s ease;
        }
        .diag-step-info {
            font-size: 0.85rem; color: var(--text-muted);
            margin-bottom: 0.5rem; text-align: center;
        }
        .diag-type-badge {
            display: inline-block; font-size: 0.7rem; padding: 2px 8px;
            border-radius: 12px; font-weight: 600; margin-bottom: 0.75rem;

        .diag-type-vf { background: #fef3c7; color: #92400e; }
        .diag-type-situacao { background: #ede9fe; color: #5b21b6; }
        .diag-type-auto { background: #dcfce7; color: #166534; }

        .diag-question-text {
            font-size: 1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.5;
        }
        .diag-situation-context {
            background: #f0f9ff; border: 1px solid #bae6fd; border-radius: var(--radius);

            border: 2px solid var(--border); border-radius: var(--radius);

            justify-content: center; font-weight: 700; font-size: 0.85rem;
            flex-shrink: 0;
        }
        .diag-alt-btn.selected .diag-alt-letter { background: var(--primary); color: white; }
        .diag-alt-btn.correct .diag-alt-letter { background: var(--success); color: white; }
        .diag-alt-btn.wrong .diag-alt-letter { background: var(--danger); color: white; }

        .diag-vf-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .diag-vf-btn {
            padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius);
            background: var(--surface); cursor: pointer; font-size: 1rem;
            font-weight: 700; text-align: center; transition: all 0.2s;
        }
        .diag-vf-btn:hover { border-color: var(--primary); }
        .diag-vf-btn.selected-v { border-color: var(--success); background: #dcfce7; color: var(--success); }
        .diag-vf-btn.selected-f { border-color: var(--danger); background: #fee2e2; color: var(--danger); }
        .diag-vf-btn.correct { border-color: var(--success); background: #dcfce7; }
        .diag-vf-btn.wrong { border-color: var(--danger); background: #fee2e2; }

        .diag-auto-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .diag-auto-btn {
            padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius);
            background: var(--surface); cursor: pointer; font-size: 0.95rem;
            font-weight: 600; text-align: center; transition: all 0.2s;
        }
        .diag-auto-btn:hover { border-color: var(--primary); }
        .diag-auto-btn.selected { border-color: var(--primary); background: #dbeafe; }

        .diag-feedback {
            margin-top: 1rem; padding: 1rem; border-radius: var(--radius);
            font-size: 0.9rem; display: none;
        }
        .diag-feedback.visible { display: block; }
        .diag-feedback.correct { background: #dcfce7; border: 1px solid #86efac; }
        .diag-feedback.wrong { background: #fee2e2; border: 1px solid #fca5a5; }
        .diag-feedback.neutral { background: #eff6ff; border: 1px solid #93c5fd; }

        .diag-result-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem;
        }
        .diag-result-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.75rem;
        }
        .diag-score-circle {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.1rem; color: white;
        }
        .diag-score-good { background: var(--success); }
        .diag-score-medium { background: var(--warning); }
        .diag-score-bad { background: var(--danger); }

        .diag-subtopic-bar {
            display: flex; align-items: center; gap: 0.5rem;
            margin-bottom: 0.5rem; font-size: 0.85rem;
        }
        .diag-subtopic-bar .bar-bg {
            flex: 1; height: 12px; background: var(--border);
            border-radius: 6px; overflow: hidden;
        }
        .diag-subtopic-bar .bar-fill {
            height: 100%; border-radius: 6px; transition: width 0.5s;
        }
        .diag-subtopic-label { min-width: 120px; font-weight: 600; }
        .diag-subtopic-value { min-width: 40px; text-align: right; font-weight: 600; }

        .diag-tag {
            display: inline-block; padding: 3px 8px; border-radius: 4px;
            font-size: 0.75rem; font-weight: 600; margin: 2px;
        }
        .diag-tag-strength { background: #dcfce7; color: #166534; }
        .diag-tag-weakness { background: #fee2e2; color: #991b1b; }
        .diag-tag-neutral { background: #f1f5f9; color: #475569; }
    </style>
</head>

                    introduction: "Administrar é uma atividade presente em todos os aspectos da vida humana. Seja organizando seu tempo de estudo, gerenciando as finanças de casa ou dirigindo uma grande empresa, você está administrando. Neste módulo, vamos entender o que é Administração do ponto de vista técnico e como ela se aplica às organizações — especialmente às públicas.",
                    detailed: "A <strong>Administração</strong> é o processo de planejar, organizar, dirigir e controlar o uso de recursos (humanos, financeiros, materiais, tecnológicos e informacionais) para alcançar objetivos organizacionais.\n\nUma <strong>organização</strong> é um grupo de pessoas que trabalham juntas de forma coordenada para atingir metas comuns. Elas podem ser:\n• <strong>Públicas</strong>: vinculadas ao Estado (ex: ministérios, prefeituras, universidades federais).\n• <strong>Privadas</strong>: visam lucro (ex: empresas).\n• <strong>Do terceiro setor</strong>: sem fins lucrativos (ex: ONGs, fundações).\n\nOs <strong>recursos organizacionais</strong> são os meios disponíveis para alcançar os objetivos:\n• <strong>Humanos</strong>: pessoas, competências, trabalho.\n• <strong>Financeiros</strong>: dinheiro, capital, orçamento.\n• <strong>Materiais</strong>: equipamentos, matérias-primas, instalações.\n• <strong>Tecnológicos</strong>: máquinas, softwares, técnicas.\n• <strong>Informacionais</strong>: dados, conhecimento, sistemas.\n\nAs organizações possuem <strong>três níveis hierárquicos</strong>:\n• <strong>Estratégico</strong>: alta direção. Define missão, visão e objetivos de longo prazo.\n• <strong>Tático</strong>: gerência/médio escalão. Traduz a estratégia em planos departamentais.\n• <strong>Operacional</strong>: supervisão/execução. Realiza as tarefas do dia a dia.",

            exportData(state) {

                a.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2)));
                a.setAttribute("download", "admin-dir-backup-" + new Date().toISOString().slice(0,10) + ".json");
                document.body.appendChild(a); a.click(); a.remove();
                UI.toast("Backup exportado!");
            },
            importData(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imp = JSON.parse(e.target.result);
                        if (imp && imp.version) { Storage.save(imp); UI.toast("Importado! Recarregando..."); setTimeout(() => location.reload(), 1500); }
                        else throw new Error("Inválido");
                    } catch (err) { UI.toast("Arquivo inválido."); }
                };
                reader.readAsText(file);
            }
        };

        /* =========================================
           3. CAMADA DE ESTADO (STATE)
           ========================================= */
        let AppState = {
            version: "0.3", schema: 1,
            createdAt: new Date().toISOString(), lastAccess: new Date().toISOString(),
            progress: { modules: {}, questionsAnswered: 0, questionsCorrect: 0 },
            errors: {}, reviews: {},
            diagnosis: {},
            settings: { theme: "light", dailyGoal: 20 }
        };

        const State = {
            init() {
                const saved = Storage.load();
                if (saved && saved.schema === AppState.schema) { AppState = { ...AppState, ...saved }; }
                else { Storage.save(AppState); }
                AppState.lastAccess = new Date().toISOString();
                Storage.save(AppState);
            },
            save() { AppState.lastAccess = new Date().toISOString(); Storage.save(AppState); },
            reset() {
                if (confirm("ATENÇÃO: Isso apagará TODO o seu progresso.\n\nDeseja continuar?")) {
                    localStorage.removeItem(Storage.KEY_STATE);
                    UI.toast("Resetado. Recarregando...");
                    setTimeout(() => location.reload(), 1000);
                }
            },
            markLessonViewed(moduleId) {
                if (!AppState.progress.modules[moduleId]) {
                    AppState.progress.modules[moduleId] = { status: "em_andamento", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                }
                AppState.progress.modules[moduleId].lessonViewed = true;
                AppState.progress.modules[moduleId].lastAccess = new Date().toISOString();
                State.save();
            },
            saveDiagnosis(moduleId, results, strengths, weaknesses, recommendation) {
                AppState.diagnosis[moduleId] = {
                    doneAt: new Date().toISOString(),
                    results: results,
                    strengths: strengths,
                    weaknesses: weaknesses,
                    recommendation: recommendation
                };
                if (!AppState.progress.modules[moduleId]) {
                    AppState.progress.modules[moduleId] = { status: "diagnostico", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                }
                AppState.progress.modules[moduleId].diagnosisDone = true;
                AppState.progress.modules[moduleId].status = "em_andamento";
                State.save();
            }
        };

        /* =========================================
           4. CAMADA DE INTERFACE (UI)
           ========================================= */
        const UI = {
            toast(msg) {
                const el = document.getElementById('toast');
                el.textContent = msg; el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 3000);
            },
            getPriorityBadge(p) {
                return { 'alta': '<span class="badge badge-alta">Alta</span>', 'media': '<span class="badge badge-media">Média</span>', 'baixa': '<span class="badge badge-baixa">Baixa</span>' }[p] || '';
            },

            renderDashboard() {
                const total = Data.modules.length;
                const studied = Object.keys(AppState.progress.modules).length;
                const diagDone = Object.keys(AppState.diagnosis).length;
                const acc = AppState.progress.questionsAnswered > 0 ? Math.round((AppState.progress.questionsCorrect / AppState.progress.questionsAnswered) * 100) : 0;
                return `
                    <div class="card">
                        <h2>👋 Bem-vindo de volta!</h2>
                        <div class="stat-grid">
                            <div class="stat-box"><div class="stat-value">${studied}/${total}</div><div class="stat-label">Módulos Iniciados</div></div>
                            <div class="stat-box"><div class="stat-value">${diagDone}</div><div class="stat-label">Diagnósticos Feitos</div></div>
                            <div class="stat-box"><div class="stat-value">${acc}%</div><div class="stat-label">Taxa de Acerto</div></div>
                            <div class="stat-box"><div class="stat-value">${Object.keys(AppState.errors).length}</div><div class="stat-label">Erros</div></div>
                        </div>
                        <button class="btn btn-primary" onclick="Router.navigate('modules')">Continuar Estudando</button>
                    </div>
                    <div class="card"><h3>🚧 Fase 3</h3><p style="font-size:0.9rem;color:var(--text-muted);">Diagnóstico inicial ativo para ADM-01, ADM-02 e ADM-03.</p></div>`;
            },

            renderModules() {
                let html = `<div class="card"><h2>📚 Módulos</h2>`;
                Data.modules.forEach(mod => {
                    const p = AppState.progress.modules[mod.id];
                    const d = AppState.diagnosis[mod.id];
                    let status = "⭕ Não iniciado";
                    if (d) status = "✅ Diagnóstico feito";
                    else if (p && p.lessonViewed) status = "📖 Aula visualizada";
                    else if (p) status = "⚠️ Em andamento";
                    html += `<div class="module-item" onclick="Router.navigate('topic','${mod.id}')">
                        <div><div style="font-weight:600;">${mod.id} — ${mod.title}</div><div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">${status}</div></div>
                        ${UI.getPriorityBadge(mod.priority)}</div>`;
                });
                return html + `</div>`;
            },

            renderTopic(moduleId) {
                const mod = Data.modules.find(m => m.id === moduleId);
                if (!mod) return `<div class="card"><h2>Não encontrado</h2></div>`;
                const hasLesson = Data.lessons[moduleId];
                const hasDiag = Data.diagnosis[moduleId];
                const diagDone = AppState.diagnosis[moduleId];
                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('modules')">← Voltar</button>
                        <h2>${mod.id} — ${mod.title}</h2>
                        <div style="margin:1rem 0;">${UI.getPriorityBadge(mod.priority)}</div>
                        ${diagDone ? `<div class="success-box">✅ Diagnóstico concluído em ${new Date(diagDone.doneAt).toLocaleDateString('pt-BR')}.</div>` : ''}
                        <div style="display:flex;flex-direction:column;gap:0.5rem;">
                            ${hasDiag ? `<button class="btn ${diagDone ? 'btn-outline' : 'btn-primary'}" onclick="Router.navigate('diagnosis','${moduleId}')">${diagDone ? '🔄 Refazer Diagnóstico' : '📝 Fazer Diagnóstico Inicial'}</button>` : ''}
                            ${hasLesson ? `<button class="btn btn-outline" onclick="Router.navigate('lesson','${moduleId}')">📖 Ler Aula Teórica</button>` : ''}
                            <button class="btn btn-outline" onclick="UI.toast('Fase 4')">⚔️ Praticar Questões</button>
                        </div>
                    </div>`;
            },

            renderLesson(moduleId) {
                const mod = Data.modules.find(m => m.id === moduleId);
                const lesson = Data.lessons[moduleId];
                if (!mod || !lesson) return `<div class="card"><h2>Aula não encontrada</h2></div>`;
                State.markLessonViewed(moduleId);
                const prereqs = lesson.prerequisites.length > 0 ? lesson.prerequisites.map(p => { const pm = Data.modules.find(m => m.id === p); return pm ? pm.title : p; }).join(", ") : "Nenhum.";
                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button>
                        <h2>${mod.id} — ${mod.title}</h2>
                    </div>
                    <div class="card">
                        <div class="lesson-section"><h3>🎯 Objetivo</h3><p>${lesson.objective}</p></div>
                        <div class="lesson-section"><h3>📋 Pré-requisitos</h3><p>${prereqs}</p></div>
                        <div class="lesson-section"><h3>📖 Introdução</h3><p>${lesson.introduction}</p></div>
                        <div class="lesson-section"><h3>📘 Explicação Detalhada</h3><div>${lesson.detailed.replace(/\n/g,'<br>')}</div></div>
                        <div class="lesson-section"><h3>🔬 Explicação Técnica</h3><p>${lesson.technical}</p></div>
                        <div class="lesson-section"><h3>💡 Exemplos</h3><ul>${lesson.examples.map(e=>`<li>${e}</li>`).join('')}</ul></div>
                        <div class="lesson-section"><h3>🔄 Comparações</h3><table class="comparison-table"><thead><tr><th>Conceito</th><th>Definição</th><th>Palavra-chave</th></tr></thead><tbody>${lesson.comparisons.map(c=>`<tr><td><strong>${c.concept}</strong></td><td>${c.definition}</td><td>${c.highlight||c.focus||''}</td></tr>`).join('')}</tbody></table></div>
                        <div class="lesson-section"><h3>🏛️ Aplicação Pública</h3><div class="highlight-box">${lesson.publicAdminApplication}</div></div>
                        <div class="lesson-section"><h3>🎯 Pegadinhas</h3>${lesson.traps.map(t=>`<div class="trap-box">⚠️ ${t}</div>`).join('')}</div>
                        <div class="lesson-section"><h3>⚠️ Erros Comuns</h3>${lesson.commonErrors.map(e=>`<div class="error-box">❌ ${e}</div>`).join('')}</div>
                        <div class="lesson-section"><h3>📝 Resumo</h3><div class="success-box">${lesson.summary.replace(/\n/g,'<br>')}</div></div>
                        <div class="lesson-section"><h3>👨‍🏫 Modo Professor</h3><div class="teacher-mode"><div class="teacher-buttons"><button onclick="UI.toggleTeacher('s-${moduleId}',this)">🧒 Simples</button><button onclick="UI.toggleTeacher('e-${moduleId}',this)">💡 Exemplos</button><button onclick="UI.toggleTeacher('x-${moduleId}',this)">🎓 Concurso</button></div><div id="s-${moduleId}" class="teacher-content">${lesson.simpleExplanation}</div><div id="e-${moduleId}" class="teacher-content"><ul>${lesson.moreExamples.map(e=>`<li>${e}</li>`).join('')}</ul></div><div id="x-${moduleId}" class="teacher-content">${lesson.examFocus.replace(/\n/g,'<br>')}</div></div></div>
                        <div class="lesson-section"><h3>🧠 Recuperação Ativa</h3>${lesson.activeRecovery.map((r,i)=>`<div class="recovery-card"><div class="recovery-question">${i+1}. ${r.question}</div><button class="recovery-btn" onclick="UI.toggleRecovery('rc-${moduleId}-${i}',this)">Revelar</button><div id="rc-${moduleId}-${i}" class="recovery-answer">${r.answer}</div></div>`).join('')}</div>
                    </div>`;
            },

            /* =========================================
               DIAGNÓSTICO (FASE 3)
               ========================================= */
            diagState: { moduleId: null, step: 0, answers: {}, showingFeedback: false },

            renderDiagnosis(moduleId) {
                const diag = Data.diagnosis[moduleId];
                if (!diag) return `<div class="card"><h2>Diagnóstico não disponível</h2></div>`;

                UI.diagState.moduleId = moduleId;
                UI.diagState.step = 0;
                UI.diagState.answers = {};
                UI.diagState.showingFeedback = false;

                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Voltar ao Módulo</button>
                        <h2>📝 ${diag.title}</h2>
                        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1rem;">${diag.description}</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">Total de perguntas: <strong>${diag.questions.length}</strong></p>
                        <button class="btn btn-primary" onclick="UI.startDiagnosis()">Iniciar Diagnóstico</button>
                    </div>`;
            },

            startDiagnosis() {
                UI.diagState.step = 0;
                UI.diagState.answers = {};
                UI.diagState.showingFeedback = false;
                UI.renderDiagQuestion();
            },

            renderDiagQuestion() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                const q = diag.questions[UI.diagState.step];
                const total = diag.questions.length;
                const step = UI.diagState.step + 1;
                const pct = Math.round((UI.diagState.step / total) * 100);

                UI.diagState.showingFeedback = false;

                const typeLabels = {
                    'multipla_escolha': '<span class="diag-type-badge diag-type-multipla">Múltipla Escolha</span>',
                    'verdadeiro_falso': '<span class="diag-type-badge diag-type-vf">Verdadeiro ou Falso</span>',
                    'situacao': '<span class="diag-type-badge diag-type-situacao">Situação Prática</span>',
                    'autoavaliacao': '<span class="diag-type-badge diag-type-auto">Autoavaliação</span>'
                };

                let questionHtml = '';

                if (q.type === 'multipla_escolha' || q.type === 'situacao') {
                    questionHtml = `
                        ${q.situation ? `<div class="diag-situation-context">📋 ${q.situation}</div>` : ''}
                        <div class="diag-question-text">${q.statement}</div>
                        <div class="diag-alternatives" id="diag-alts">
                            ${q.alternatives.map(a => `
                                <button class="diag-alt-btn" data-id="${a.id}" onclick="UI.selectDiagAlt('${a.id}')">
                                    <span class="diag-alt-letter">${a.id}</span>
                                    <span>${a.text}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div id="diag-feedback" class="diag-feedback"></div>
                        <button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">
                            ${step < total ? 'Próxima Pergunta →' : 'Ver Resultado →'}
                        </button>
                    `;
                } else if (q.type === 'verdadeiro_falso') {
                    questionHtml = `
                        <div class="diag-question-text">${q.statement}</div>
                        <div class="diag-vf-buttons" id="diag-vf-btns">
                            <button class="diag-vf-btn" data-val="true" onclick="UI.selectDiagVF(true)">✅ VERDADEIRO</button>
                            <button class="diag-vf-btn" data-val="false" onclick="UI.selectDiagVF(false)">❌ FALSO</button>
                        </div>
                        <div id="diag-feedback" class="diag-feedback"></div>
                        <button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">
                            ${step < total ? 'Próxima Pergunta →' : 'Ver Resultado →'}
                        </button>
                    `;
                } else if (q.type === 'autoavaliacao') {
                    questionHtml = `
                        <div class="diag-question-text">${q.statement}</div>
                        <div class="diag-auto-buttons" id="diag-auto-btns">
                            <button class="diag-auto-btn" onclick="UI.selectDiagAuto(true)">✅ Eu já sabia</button>
                            <button class="diag-auto-btn" onclick="UI.selectDiagAuto(false)">❌ Eu não sabia</button>
                        </div>
                        <button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">
                            ${step < total ? 'Próxima Pergunta →' : 'Ver Resultado →'}
                        </button>
                    `;
                }

                document.getElementById('app-container').innerHTML = `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Sair do Diagnóstico</button>
                        <div class="diag-progress-bar"><div class="diag-progress-fill" style="width:${pct}%"></div></div>
                        <div class="diag-step-info">Pergunta ${step} de ${total} • ${q.subtopicName}</div>
                        ${typeLabels[q.type]}
                        ${questionHtml}
                    </div>`;
            },

            selectDiagAlt(altId) {
                if (UI.diagState.showingFeedback) return;
                UI.diagState.showingFeedback = true;

                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                const isCorrect = altId === q.answer;

                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: isCorrect, userAnswer: altId };

                document.querySelectorAll('.diag-alt-btn').forEach(btn => {
                    btn.style.pointerEvents = 'none';
                    if (btn.dataset.id === q.answer) btn.classList.add('correct');
                    else if (btn.dataset.id === altId && !isCorrect) btn.classList.add('wrong');
                });

                const fb = document.getElementById('diag-feedback');
                fb.className = `diag-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                fb.innerHTML = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou.'}</strong><br>${q.explanation}`;
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },

            selectDiagVF(val) {
                if (UI.diagState.showingFeedback) return;
                UI.diagState.showingFeedback = true;

                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                const isCorrect = val === q.answer;

                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: isCorrect, userAnswer: val };

                document.querySelectorAll('.diag-vf-btn').forEach(btn => {
                    btn.style.pointerEvents = 'none';
                    const btnVal = btn.dataset.val === 'true';
                    if (btnVal === q.answer) btn.classList.add('correct');
                    else if (btnVal === val && !isCorrect) btn.classList.add('wrong');
                });

                const fb = document.getElementById('diag-feedback');
                fb.className = `diag-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                fb.innerHTML = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou.'}</strong><br>${q.explanation}`;
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },

            selectDiagAuto(knew) {
                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];

                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: null, selfKnown: knew };

                document.querySelectorAll('.diag-auto-btn').forEach(btn => {
                    btn.style.pointerEvents = 'none';
                });
                event.target.classList.add('selected');

                document.getElementById('diag-next-btn').classList.remove('hidden');
            },

            nextDiagStep() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                UI.diagState.step++;

                if (UI.diagState.step >= diag.questions.length) {
                    UI.renderDiagResult();
                } else {
                    UI.renderDiagQuestion();
                }
            },

            renderDiagResult() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                const answers = UI.diagState.answers;

                // Análise por subtema
                const subtopics = {};
                let totalObjective = 0, correctObjective = 0, totalSelfKnown = 0, selfKnownCount = 0;

                Object.values(answers).forEach(a => {
                    if (!subtopics[a.subtopic]) {
                        const q = diag.questions.find(qq => qq.subtopic === a.subtopic);
                        subtopics[a.subtopic] = { name: q ? q.subtopicName : a.subtopic, total: 0, correct: 0, selfKnown: 0, selfTotal: 0 };
                    }
                    const st = subtopics[a.subtopic];
                    if (a.type === 'autoavaliacao') {
                        st.selfTotal++;
                        if (a.selfKnown) { st.selfKnown++; selfKnownCount++; }
                        totalSelfKnown++;
                    } else {
                        st.total++;
                        totalObjective++;
                        if (a.correct) { st.correct++; correctObjective++; }
                    }
                });

                const pct = totalObjective > 0 ? Math.round((correctObjective / totalObjective) * 100) : 0;
                const strengths = [];
                const weaknesses = [];

                Object.entries(subtopics).forEach(([key, st]) => {
                    const stPct = st.total > 0 ? (st.correct / st.total) * 100 : (st.selfKnown > 0 ? 100 : 50);
                    if (stPct >= 75) strengths.push(st.name);
                    else if (stPct < 50) weaknesses.push(st.name);
                });

                let recommendation = '';
                if (pct >= 80 && weaknesses.length === 0) {
                    recommendation = '🟢 Excelente! Você já tem uma boa base neste módulo. Pode avançar para a aula teórica para aprofundar e depois partir para as questões.';
                } else if (pct >= 50) {
                    recommendation = '🟡 Bom começo! Você tem alguns conhecimentos, mas há pontos a reforçar. Recomendamos estudar a aula teórica com atenção nos tópicos identificados como fracos.';
                } else {
                    recommendation = '🔴 Este módulo precisa de atenção. Não se preocupe — é para isso que o diagnóstico existe! Estude a aula teórica do início ao fim, use a recuperação ativa e depois refaça o diagnóstico.';
                }

                // Salvar no estado
                State.saveDiagnosis(moduleId, subtopics, strengths, weaknesses, recommendation);

                const scoreClass = pct >= 75 ? 'diag-score-good' : pct >= 50 ? 'diag-score-medium' : 'diag-score-bad';

                let html = `
                    <div class="card">
                        <h2>📊 Resultado do Diagnóstico</h2>
                        <p style="color:var(--text-muted);font-size:0.9rem;">${diag.title}</p>
                    </div>
                    <div class="diag-result-card">
                        <div class="diag-result-header">
                            <div>
                                <div style="font-size:0.85rem;color:var(--text-muted);">Desempenho nas questões objetivas</div>
                                <div style="font-size:1.5rem;font-weight:700;">${correctObjective}/${totalObjective} (${pct}%)</div>
                            </div>
                            <div class="diag-score-circle ${scoreClass}">${pct}%</div>
                        </div>
                        ${totalSelfKnown > 0 ? `<div style="font-size:0.85rem;color:var(--text-muted);margin-top:0.5rem;">Autoavaliação: você já conhecia ${selfKnownCount} de ${totalSelfKnown} tópicos.</div>` : ''}
                    </div>
                    <div class="diag-result-card">
                        <h3 style="margin-bottom:0.75rem;">Desempenho por Subtema</h3>
                        ${Object.entries(subtopics).map(([key, st]) => {
                            const stPct = st.total > 0 ? Math.round((st.correct / st.total) * 100) : (st.selfTotal > 0 ? Math.round((st.selfKnown / st.selfTotal) * 100) : 0);
                            const barColor = stPct >= 75 ? 'var(--success)' : stPct >= 50 ? 'var(--warning)' : 'var(--danger)';
                            const label = st.total > 0 ? `${st.correct}/${st.total}` : (st.selfTotal > 0 ? (st.selfKnown > 0 ? 'Sabia' : 'Não sabia') : '-');
                            return `<div class="diag-subtopic-bar">
                                <span class="diag-subtopic-label">${st.name}</span>
                                <div class="bar-bg"><div class="bar-fill" style="width:${stPct}%;background:${barColor}"></div></div>
                                <span class="diag-subtopic-value">${label}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    <div class="diag-result-card">
                        <h3 style="margin-bottom:0.75rem;">Pontos Fortes e Fracos</h3>
                        <div style="margin-bottom:0.5rem;">
                            <strong style="color:var(--success);">✅ Fortes:</strong>
                            ${strengths.length > 0 ? strengths.map(s => `<span class="diag-tag diag-tag-strength">${s}</span>`).join('') : '<span class="diag-tag diag-tag-neutral">Nenhum identificado ainda</span>'}
                        </div>
                        <div>
                            <strong style="color:var(--danger);">⚠️ Fracos:</strong>
                            ${weaknesses.length > 0 ? weaknesses.map(w => `<span class="diag-tag diag-tag-weakness">${w}</span>`).join('') : '<span class="diag-tag diag-tag-neutral">Nenhum — ótimo!</span>'}
                        </div>
                    </div>
                    <div class="diag-result-card">
                        <h3 style="margin-bottom:0.75rem;">💡 Recomendação</h3>
                        <p style="font-size:0.95rem;">${recommendation}</p>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                        <button class="btn btn-outline" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button>
                        <button class="btn btn-primary" onclick="Router.navigate('lesson','${moduleId}')">📖 Ir para a Aula</button>
                    </div>`;

                document.getElementById('app-container').innerHTML = html;
                window.scrollTo(0, 0);
            },

            toggleTeacher(id, btn) {
                const el = document.getElementById(id);
                const vis = el.classList.contains('visible');
                document.querySelectorAll('.teacher-content').forEach(c => c.classList.remove('visible'));
                document.querySelectorAll('.teacher-buttons button').forEach(b => b.classList.remove('active'));
                if (!vis) { el.classList.add('visible'); btn.classList.add('active'); }
            },
            toggleRecovery(id, btn) {
                const el = document.getElementById(id);
                el.classList.toggle('visible');
                btn.textContent = el.classList.contains('visible') ? 'Ocultar' : 'Revelar';
            },

            renderSettings() {
                return `
                    <div class="card">
                        <h2>⚙️ Configurações e Backup</h2>
                        <button class="btn btn-outline" onclick="Storage.exportData(AppState)">⬇️ Exportar Progresso</button>
                        <div class="file-input-wrapper"><button class="btn btn-outline">⬆️ Importar Progresso</button><input type="file" accept=".json" onchange="Storage.importData(this.files[0])"></div>
                        <h3 style="margin-top:1.5rem;color:var(--danger);">Zona de Perigo</h3>
                        <button class="btn btn-danger" onclick="App.resetData()">🗑️ Resetar Todos os Dados</button>
                    </div>
                    <div class="card"><h3>Sobre</h3><p style="font-size:0.85rem;color:var(--text-muted);"><strong>ADMIN-DIR</strong><br>Versão: 0.3 (Fase 3)<br>Single-File Offline</p></div>`;
            }
        };

        /* =========================================
           5. CAMADA DE ROTEAMENTO (ROUTER)
           ========================================= */
        const Router = {
            currentRoute: 'dashboard',
            navigate(route, param = null) {
                this.currentRoute = route;
                const container = document.getElementById('app-container');
                document.querySelectorAll('nav.bottom-nav button').forEach(btn => btn.classList.remove('active'));
                const navBtn = document.getElementById(`nav-${['topic','lesson','diagnosis'].includes(route) ? 'modules' : route}`);
                if (navBtn) navBtn.classList.add('active');
                window.scrollTo(0, 0);
                switch(route) {
                    case 'dashboard': container.innerHTML = UI.renderDashboard(); break;
                    case 'modules': container.innerHTML = UI.renderModules(); break;
                    case 'topic': container.innerHTML = UI.renderTopic(param); break;
                    case 'lesson': container.innerHTML = UI.renderLesson(param); break;
                    case 'diagnosis': container.innerHTML = UI.renderDiagnosis(param); break;
                    case 'settings': container.innerHTML = UI.renderSettings(); break;
                    default: container.innerHTML = UI.renderDashboard();
                }
            }
        };

        /* =========================================
           6. INICIALIZAÇÃO
           ========================================= */
        const App = {
            init() {
                State.init();
                document.getElementById('app-version').textContent = `v${AppState.version}`;
                Router.navigate('dashboard');
                console.log("ADMIN-DIR v0.3 inicializado.");
            },
            resetData() { State.reset(); }
        };
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
