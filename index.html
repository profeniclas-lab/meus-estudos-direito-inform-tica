<!DOCTYPE html>
<html lang="pt-BR">
<head>

        .trap-box { background: #fef3c7; border-left: 4px solid var(--warning); padding: 0.75rem 1rem; border-radius: 0 var(--radius) var(--radius) 0; margin: 0.75rem 0; font-size: 0.9rem; }

        .recovery-question { font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .recovery-answer { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #dcfce7; border-radius: var(--radius); font-size: 0.9rem; }

        .recovery-btn { font-size: 0.8rem; padding: 0.4rem 0.8rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); cursor: pointer; }

        .diag-type-badge { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; margin-bottom: 0.75rem; }
        .diag-type-multipla { background: #dbeafe; color: #1e40af; }
        .diag-type-vf { background: #fef3c7; color: #92400e; }
        .diag-type-situacao { background: #ede9fe; color: #5b21b6; }
        .diag-type-auto { background: #dcfce7; color: #166534; }
        .diag-question-text { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.5; }
        .diag-situation-context { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: var(--radius); padding: 0.75rem; margin-bottom: 1rem; font-size: 0.9rem; font-style: italic; }
        .diag-alternatives { display: flex; flex-direction: column; gap: 0.5rem; }
        .diag-alt-btn { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.2s; text-align: left; font-size: 0.95rem; width: 100%; }
        .diag-alt-btn:hover { border-color: var(--primary); background: #eff6ff; }
        .diag-alt-btn.selected { border-color: var(--primary); background: #dbeafe; font-weight: 600; }

        .diag-alt-btn.selected .diag-alt-letter { background: var(--primary); color: white; }
        .diag-alt-btn.correct .diag-alt-letter { background: var(--success); color: white; }
        .diag-alt-btn.wrong .diag-alt-letter { background: var(--danger); color: white; }
        .diag-vf-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .diag-vf-btn { padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 1rem; font-weight: 700; text-align: center; transition: all 0.2s; }
        .diag-vf-btn:hover { border-color: var(--primary); }
        .diag-vf-btn.selected-v { border-color: var(--success); background: #dcfce7; color: var(--success); }
        .diag-vf-btn.selected-f { border-color: var(--danger); background: #fee2e2; color: var(--danger); }
        .diag-vf-btn.correct { border-color: var(--success); background: #dcfce7; }
        .diag-vf-btn.wrong { border-color: var(--danger); background: #fee2e2; }
        .diag-auto-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .diag-auto-btn { padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 0.95rem; font-weight: 600; text-align: center; transition: all 0.2s; }
        .diag-auto-btn:hover { border-color: var(--primary); }
        .diag-auto-btn.selected { border-color: var(--primary); background: #dbeafe; }
        .diag-feedback { margin-top: 1rem; padding: 1rem; border-radius: var(--radius); font-size: 0.9rem; display: none; }
        .diag-feedback.visible { display: block; }
        .diag-feedback.correct { background: #dcfce7; border: 1px solid #86efac; }
        .diag-feedback.wrong { background: #fee2e2; border: 1px solid #fca5a5; }
        .diag-feedback.neutral { background: #eff6ff; border: 1px solid #93c5fd; }
        .diag-result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
        .diag-result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .diag-score-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; color: white; }
        .diag-score-good { background: var(--success); }
        .diag-score-medium { background: var(--warning); }
        .diag-score-bad { background: var(--danger); }
        .diag-subtopic-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .diag-subtopic-bar .bar-bg { flex: 1; height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; }
        .diag-subtopic-bar .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
        .diag-subtopic-label { min-width: 120px; font-weight: 600; }
        .diag-subtopic-value { min-width: 40px; text-align: right; font-weight: 600; }
        .diag-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin: 2px; }
        .diag-tag-strength { background: #dcfce7; color: #166534; }
        .diag-tag-weakness { background: #fee2e2; color: #991b1b; }
        .diag-tag-neutral { background: #f1f5f9; color: #475569; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .quiz-progress-text { font-size: 0.85rem; color: var(--text-muted); }
        .quiz-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
        .quiz-filter-select { padding: 0.5rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; background: var(--surface); }
        .quiz-type-badge { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; margin-bottom: 0.75rem; }
        .quiz-type-real { background: #fef3c7; color: #92400e; }
        .quiz-type-didatica { background: #dbeafe; color: #1e40af; }
        .quiz-statement { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.5; }
        .quiz-alternatives { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
        .quiz-alt-btn { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.2s; text-align: left; font-size: 0.95rem; width: 100%; }
        .quiz-alt-btn:hover:not(.disabled) { border-color: var(--primary); background: #eff6ff; }
        .quiz-alt-btn.selected { border-color: var(--primary); background: #dbeafe; font-weight: 600; }
        .quiz-alt-btn.correct { border-color: var(--success); background: #dcfce7; }
        .quiz-alt-btn.wrong { border-color: var(--danger); background: #fee2e2; }
        .quiz-alt-btn.disabled { pointer-events: none; opacity: 0.7; }
        .quiz-alt-letter { min-width: 28px; height: 28px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
        .quiz-alt-btn.selected .quiz-alt-letter { background: var(--primary); color: white; }
        .quiz-alt-btn.correct .quiz-alt-letter { background: var(--success); color: white; }
        .quiz-alt-btn.wrong .quiz-alt-letter { background: var(--danger); color: white; }
        .quiz-feedback { margin-top: 1rem; padding: 1rem; border-radius: var(--radius); font-size: 0.9rem; display: none; }

        .quiz-feedback.correct { background: #dcfce7; border: 1px solid #86efac; }
        .quiz-feedback.wrong { background: #fee2e2; border: 1px solid #fca5a5; }
        .quiz-feedback-section { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); }
        .quiz-feedback-section:first-child { border-top: none; margin-top: 0; padding-top: 0; }
        .quiz-feedback-section strong { display: block; margin-bottom: 0.25rem; color: var(--text); }
        .quiz-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
        .quiz-empty { text-align: center; padding: 2rem; color: var(--text-muted); }
        .quiz-empty-icon { font-size: 3rem; margin-bottom: 1rem; }

        /* =========================================
           ESTILOS DO FLASHCARD (FASE 5)
           ========================================= */
        .flashcard-container {
            perspective: 1000px;
            margin: 1rem 0;
        }
        .flashcard {
            width: 100%;
            min-height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute;
            width: 100%;
            min-height: 200px;
            backface-visibility: hidden;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .flashcard-front {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: var(--primary-dark);
        }
        .flashcard-back {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            color: #166534;
            transform: rotateY(180deg);
        }
        .flashcard-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1rem;
            font-weight: normal;
        }
        .flashcard-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .flashcard-controls button {
            padding: 0.75rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .fc-btn-knew { background: #dcfce7; color: #166534; }
        .fc-btn-doubt { background: #fef3c7; color: #92400e; }
        .fc-btn-didnt { background: #fee2e2; color: #991b1b; }
        .flashcard-progress {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
    </style>
</head>

    <main id="app-container"></main>
    <nav class="bottom-nav">

                { id: "Q-ADM-0001", type: "DIDATICA", difficulty: 1, area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.1", statement: "Sobre eficiência, eficácia e efetividade, assinale a correta:", alternatives: [{ id: "A", text: "Eficiência refere-se ao alcance de objetivos." }, { id: "B", text: "Eficácia é a relação entre recursos e resultados." }, { id: "C", text: "Eficiência é fazer as coisas certas." }, { id: "D", text: "Eficiência é fazer da maneira correta, e eficácia é alcançar objetivos." }], answer: "D", explanation: { correct: "Eficiência = meios (fazer bem, com menos recursos). Eficácia = fins (alcançar o objetivo).", wrong: { A: "Isso descreve eficácia, não eficiência.", B: "Isso descreve eficiência, não eficácia.", C: "Inverteu os conceitos: eficiência = maneira correta; eficácia = coisas certas." }, concept: "3 Es da Administração: Eficiência, Eficácia e Efetividade.", trap: "As bancas adoram inverter as definições de eficiência e eficácia.", examTip: "Decore: Eficiência = MEIOS; Eficácia = FINS; Efetividade = IMPACTO." } },

                { id: "Q-ADM-0006", type: "DIDATICA", difficulty: 2, area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.1", statement: "Uma empresa conseguiu produzir 20% a mais com o mesmo número de funcionários e mesmos recursos. No entanto, a meta de vendas não foi atingida. Pode-se afirmar que a empresa foi:", alternatives: [{ id: "A", text: "Eficaz, mas não eficiente." }, { id: "B", text: "Eficiente, mas não eficaz." }, { id: "C", text: "Eficiente e eficaz." }, { id: "D", text: "Efetiva, mas não eficiente." }], answer: "B", explanation: { correct: "A empresa foi EFICIENTE (produziu mais com os mesmos recursos = bom uso dos meios), mas NÃO foi EFICAZ (não atingiu a meta de vendas = não alcançou o fim).", wrong: { A: "Inverteu: se fosse eficaz, teria atingido a meta.", C: "Para ser ambos, precisaria ter atingido a meta usando bem os recursos.", D: "Efetividade mede impacto real, não se aplica ao caso." }, concept: "Aplicação prática dos conceitos de eficiência e eficácia.", trap: "A banca apresenta uma situação onde a empresa melhora a produção mas não atinge a meta, testando se o candidato sabe diferenciar meios de fins.", examTip: "Situações práticas são comuns: identifique se houve bom uso de recursos (eficiência) e se a meta foi atingida (eficácia)." } },
                { id: "Q-ADM-0007", type: "DIDATICA", difficulty: 1, area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.2", statement: "Sobre as organizações, é CORRETO afirmar:", alternatives: [{ id: "A", text: "Organização é sinônimo de empresa." }, { id: "B", text: "Apenas organizações públicas possuem recursos organizacionais." }, { id: "C", text: "Uma ONG é uma organização do terceiro setor, sem fins lucrativos." }, { id: "D", text: "Organizações privadas não possuem níveis hierárquicos." }], answer: "C", explanation: { correct: "ONGs são organizações do terceiro setor, que não visam lucro. Organização é um conceito mais amplo que empresa.", wrong: { A: "Empresa é um tipo de organização (privada, com fim lucrativo), mas organização inclui também públicas e terceiro setor.", B: "Toda organização possui recursos organizacionais, independente do setor.", D: "Todas as organizações possuem níveis hierárquicos (estratégico, tático, operacional)." }, concept: "Conceito de organização e tipos (pública, privada, terceiro setor).", trap: "Confundir organização com empresa é um erro comum.", examTip: "Organização = conceito amplo. Empresa = tipo específico (privada, com fim lucrativo)." } },

                { id: "Q-ADM-0011", type: "DIDATICA", difficulty: 1, area: "ADM", moduleId: "ADM-03", topicId: "ADM-03.2", statement: "A diferença entre objetivo e meta é que:", alternatives: [{ id: "A", text: "Objetivo é específico e mensurável; meta é geral." }, { id: "B", text: "Objetivo é geral e amplo; meta é específica, mensurável e com prazo." }, { id: "C", text: "Objetivo e meta são sinônimos." }, { id: "D", text: "Objetivo tem prazo definido; meta não." }], answer: "B", explanation: { correct: "OBJETIVO = resultado geral que se deseja alcançar (amplo). META = objetivo específico, mensurável e com prazo definido.", wrong: { A: "Inverteu: objetivo é geral, meta é específica.", C: "Não são sinônimos: objetivo é mais amplo, meta é mais específica.", D: "Inverteu: meta tem prazo, objetivo geralmente não." }, concept: "Elementos do planejamento: objetivo vs meta.", trap: "Confundir objetivo com meta é um erro muito comum.", examTip: "Meta = SMART (Específica, Mensurável, Atingível, Relevante, com prazo)." } },
                { id: "Q-ADM-0012", type: "DIDATICA", difficulty: 2, area: "ADM", moduleId: "ADM-03", topicId: "ADM-03.2", statement: "Na análise SWOT (FOFA), as forças e fraquezas são classificadas como fatores:", alternatives: [{ id: "A", text: "Externos e não controláveis." }, { id: "B", text: "Internos e controláveis." }, { id: "C", text: "Externos e controláveis." }, { id: "D", text: "Internos e não controláveis." }], answer: "B", explanation: { correct: "Forças e Fraquezas são fatores INTERNOS (da organização) e CONTROLÁVEIS (podem ser modificados pela gestão).", wrong: { A: "Isso descreve oportunidades e ameaças.", C: "Fatores externos não são controláveis.", D: "Fatores internos são controláveis." }, concept: "Análise SWOT/FOFA: ambiente interno vs externo.", trap: "Confundir fatores internos (forças/fraquezas) com externos (oportunidades/ameaças).", examTip: "Forças e Fraquezas = INTERNOS. Oportunidades e Ameaças = EXTERNOS." } },
                { id: "Q-ADM-0013", type: "DIDATICA", difficulty: 2, area: "ADM", moduleId: "ADM-03", topicId: "ADM-03.1", statement: "O planejamento tático caracteriza-se por:", alternatives: [{ id: "A", text: "Longo prazo, abrangência global e definição de missão." }, { id: "B", text: "Curto prazo, foco em tarefas e rotinas detalhadas." }, { id: "C", text: "Médio prazo, abrangência departamental e tradução da estratégia." }, { id: "D", text: "Longo prazo, foco em oportunidades externas." }], answer: "C", explanation: { correct: "O planejamento TÁTICO é de MÉDIO prazo, abrange DEPARTAMENTOS e tem como função TRADUZIR a estratégia em planos específicos.", wrong: { A: "Isso descreve o planejamento estratégico.", B: "Isso descreve o planejamento operacional.", D: "O estratégico foca no longo prazo e ambiente externo." }, concept: "Características dos 3 níveis de planejamento.", trap: "A banca descreve um nível sem nomeá-lo, e o candidato deve identificar.", examTip: "Tático = MÉDIO prazo + DEPARTAMENTAL + TRADUZIR estratégia." } },
                { id: "Q-ADM-0015", type: "DIDATICA", difficulty: 1, area: "ADM", moduleId: "ADM-03", topicId: "ADM-03.3", statement: "A Lei de Diretrizes Orçamentárias (LDO) corresponde a qual nível de planejamento?", alternatives: [{ id: "A", text: "Estratégico." }, { id: "B", text: "Tático." }, { id: "C", text: "Operacional." }, { id: "D", text: "Normativo." }], answer: "B", explanation: { correct: "A LDO é o instrumento de planejamento TÁTICO do setor público, com horizonte anual, estabelecendo diretrizes para o orçamento.", wrong: { A: "O PPA corresponde ao estratégico.", C: "A LOA corresponde ao operacional.", D: "'Normativo' não é um nível de planejamento." }, concept: "Instrumentos de planejamento público: PPA, LDO, LOA.", trap: "Confundir LDO com LOA ou PPA.", examTip: "PPA=Estratégico (4 anos); LDO=Tático (anual, diretrizes); LOA=Operacional (anual, orçamento)." } },

                // === DA-01: Direito Administrativo (4 questões) ===
                { id: "Q-DA-0001", type: "DIDATICA", difficulty: 2, area: "DA", moduleId: "DA-01", topicId: "DA-01.1", statement: "O princípio que exige imparcialidade é:", alternatives: [{ id: "A", text: "Legalidade" }, { id: "B", text: "Impessoalidade" }, { id: "C", text: "Publicidade" }, { id: "D", text: "Eficiência" }], answer: "B", explanation: { correct: "O princípio da IMPESSOALIDADE exige que o agente público atue com neutralidade, sem promoção pessoal, em prol do interesse público.", wrong: { A: "Legalidade = subordinação à lei.", C: "Publicidade = transparência dos atos.", D: "Eficiência = desempenho funcional com bom uso dos recursos." }, concept: "Princípios explícitos da Administração Pública (Art. 37, CF).", trap: "Confundir impessoalidade com moralidade.", examTip: "LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência." } },
                { id: "Q-DA-0002", type: "DIDATICA", difficulty: 2, area: "DA", moduleId: "DA-01", topicId: "DA-01.1", statement: "O princípio da legalidade na Administração Pública significa que:", alternatives: [{ id: "A", text: "O administrador pode fazer tudo o que a lei não proíbe." }, { id: "B", text: "O administrador só pode fazer o que a lei autoriza ou determina." }, { id: "C", text: "A lei é opcional para o administrador." }, { id: "D", text: "O administrador pode criar leis por decreto." }], answer: "B", explanation: { correct: "Na Administração Pública, o princípio da legalidade exige que o agente só faça o que a LEI AUTORIZA ou DETERMINA. Diferente do particular, que pode fazer tudo que a lei não proíbe.", wrong: { A: "Isso vale para o PARTICULAR, não para o administrador público.", C: "A lei é obrigatória, não opcional.", D: "O administrador não cria leis, apenas executa." }, concept: "Princípio da legalidade na Administração Pública vs. particular.", trap: "Confundir a legalidade do administrador com a do particular.", examTip: "Particular = pode fazer tudo que a lei NÃO PROÍBE. Administrador = só pode fazer o que a lei AUTORIZA." } },
                { id: "Q-DA-0003", type: "DIDATICA", difficulty: 2, area: "DA", moduleId: "DA-01", topicId: "DA-01.1", statement: "O princípio da publicidade dos atos administrativos tem como objetivo:", alternatives: [{ id: "A", text: "Garantir que os atos sejam secretos." }, { id: "B", text: "Assegurar a transparência e o controle social dos atos da Administração." }, { id: "C", text: "Permitir que o administrador aja sem fiscalização." }, { id: "D", text: "Impedir que o cidadão tenha acesso às informações públicas." }], answer: "B", explanation: { correct: "O princípio da PUBLICIDADE exige que os atos administrativos sejam divulgados oficialmente (publicação no Diário Oficial, por exemplo) para garantir transparência e permitir o controle social.", wrong: { A: "É o oposto: a publicidade veda o sigilo, salvo exceções legais.", C: "A publicidade permite a fiscalização, não impede.", D: "É o oposto: a publicidade garante o acesso às informações." }, concept: "Princípio da publicidade e transparência.", trap: "Confundir publicidade com propaganda governamental.", examTip: "Publicidade = TRANSPARÊNCIA. Não é propaganda, é divulgação oficial para controle." } },
                { id: "Q-DA-0004", type: "DIDATICA", difficulty: 3, area: "DA", moduleId: "DA-01", topicId: "DA-01.1", statement: "Um prefeito determina que todas as obras públicas do município devem conter uma placa com seu nome e foto, destacando sua atuação pessoal. Essa conduta fere qual princípio da Administração Pública?", alternatives: [{ id: "A", text: "Legalidade." }, { id: "B", text: "Impessoalidade." }, { id: "C", text: "Publicidade." }, { id: "D", text: "Eficiência." }], answer: "B", explanation: { correct: "A conduta fere o princípio da IMPESSOALIDADE, que veda a promoção pessoal do agente público. As obras são do município, não do prefeito.", wrong: { A: "Legalidade = subordinação à lei. Não é o foco do caso.", C: "Publicidade = transparência. A placa até publica, mas de forma indevida.", D: "Eficiência = desempenho. Não se relaciona com promoção pessoal." }, concept: "Vedação à promoção pessoal (impessoalidade).", trap: "Situações práticas com promoção pessoal são comuns em provas.", examTip: "Promoção pessoal = fere IMPESSOALIDADE. Obra é do órgão, não do gestor." } }
            ],
            /* =========================================
               FLASHCARDS EXPANDIDOS (FASE 5)
               12 flashcards de alta qualidade
               IDs validados, sem duplicatas
               ========================================= */
            flashcards: [
                // ADM-01 (5 flashcards)
                { id: "F-ADM-0001", area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.1", difficulty: 1, tags: ["conceito"], front: "O que é Eficiência?", back: "Foco nos MEIOS. Fazer mais com menos recursos. Relação entre recursos usados e resultados." },
                { id: "F-ADM-0002", area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.1", difficulty: 1, tags: ["conceito"], front: "O que é Eficácia?", back: "Foco nos FINS. Alcançar os objetivos propostos, independente dos recursos." },
                { id: "F-ADM-0003", area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.2", difficulty: 1, tags: ["recursos"], front: "Quais são os 5 recursos organizacionais?", back: "Humanos, financeiros, materiais, tecnológicos e informacionais." },
                { id: "F-ADM-0007", area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.3", difficulty: 1, tags: ["níveis"], front: "Quais são os 3 níveis hierárquicos?", back: "Estratégico (longo prazo, alta direção), Tático (médio prazo, gerência), Operacional (curto prazo, execução)." },
                { id: "F-ADM-0008", area: "ADM", moduleId: "ADM-01", topicId: "ADM-01.1", difficulty: 1, tags: ["conceito"], front: "O que é Efetividade?", back: "Foco no IMPACTO real. O resultado gerou benefício efetivo para a sociedade?" },
                // ADM-02 (3 flashcards)
                { id: "F-ADM-0004", area: "ADM", moduleId: "ADM-02", topicId: "ADM-02.1", difficulty: 1, tags: ["PODC"], front: "O que significa PODC?", back: "Planejamento, Organização, Direção e Controle — as 4 funções do processo administrativo." },
                { id: "F-ADM-0009", area: "ADM", moduleId: "ADM-02", topicId: "ADM-02.1", difficulty: 1, tags: ["PODC"], front: "O PODC é sequencial?", back: "NÃO. É contínuo, simultâneo e cíclico. As funções ocorrem ao mesmo tempo, não em ordem rígida." },
                { id: "F-ADM-0010", area: "ADM", moduleId: "ADM-02", topicId: "ADM-02.1", difficulty: 1, tags: ["PODC"], front: "Quem sistematizou o PODC?", back: "Henri Fayol (1916). Originalmente eram 5 funções: Prever, Organizar, Comandar, Coordenar e Controlar." },
                // ADM-03 (3 flashcards)
                { id: "F-ADM-0005", area: "ADM", moduleId: "ADM-03", topicId: "ADM-03.1", difficulty: 2, tags: ["planejamento"], front: "PPA, LDO, LOA = quais níveis?", back: "PPA=Estratégico (4 anos), LDO=Tático (anual), LOA=Operacional (anual)." },
                { id: "F-ADM-0006", area: "ADM", moduleId: "ADM-03", topicId: "ADM-03.2", difficulty: 2, tags: ["SWOT"], front: "Na SWOT, o que é interno?", back: "Forças e Fraquezas (controláveis). Oportunidades e Ameaças são externas (não controláveis)." },
                { id: "F-ADM-0011", area: "ADM", moduleId: "ADM-03", topicId: "ADM-03.2", difficulty: 2, tags: ["objetivo"], front: "Diferença entre objetivo e meta?", back: "Objetivo = geral, amplo. Meta = específica, mensurável, com prazo definido." },
                // DA-01 (1 flashcard)
                { id: "F-DA-0001", area: "DA", moduleId: "DA-01", topicId: "DA-01.1", difficulty: 2, tags: ["princípios"], front: "Quais são os princípios LIMPE?", back: "Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência (Art. 37, CF)." }
            ]
        };

        const Storage = {
            KEY_STATE: "admin-dir:state:v1",
            load() {
                try { const raw = localStorage.getItem(this.KEY_STATE); if (raw) return JSON.parse(raw); }
                catch (e) { console.error("Erro ao carregar:", e); }
                return null;
            },
            save(state) {
                try { localStorage.setItem(this.KEY_STATE, JSON.stringify(state)); }
                catch (e) { console.error("Erro ao salvar:", e); UI.toast("Erro ao salvar."); }
            },
            exportData(state) {
                const a = document.createElement('a');
                a.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2)));
                a.setAttribute("download", "admin-dir-backup-" + new Date().toISOString().slice(0,10) + ".json");
                document.body.appendChild(a); a.click(); a.remove();
                UI.toast("Backup exportado!");
            },
            importData(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imp = JSON.parse(e.target.result);
                        if (imp && imp.version) { Storage.save(imp); UI.toast("Importado!"); setTimeout(() => location.reload(), 1500); }
                        else throw new Error("Inválido");
                    } catch (err) { UI.toast("Arquivo inválido."); }
                };
                reader.readAsText(file);
            }
        };

        let AppState = {
            version: "0.5", schema: 1,
            createdAt: new Date().toISOString(), lastAccess: new Date().toISOString(),
            progress: { modules: {}, questionsAnswered: 0, questionsCorrect: 0, questionLog: [] },
            errors: {}, reviews: {},
            diagnosis: {},
            settings: { theme: "light", dailyGoal: 20 }
        };

        const State = {
            init() {
                const saved = Storage.load();
                if (saved && saved.schema === AppState.schema) { AppState = { ...AppState, ...saved }; }
                else { Storage.save(AppState); }
                AppState.lastAccess = new Date().toISOString();
                Storage.save(AppState);
            },
            save() { AppState.lastAccess = new Date().toISOString(); Storage.save(AppState); },
            reset() {
                if (confirm("ATENÇÃO: Isso apagará TODO o seu progresso.\n\nDeseja continuar?")) {
                    localStorage.removeItem(Storage.KEY_STATE);
                    UI.toast("Resetado.");
                    setTimeout(() => location.reload(), 1000);
                }
            },
            markLessonViewed(moduleId) {
                if (!AppState.progress.modules[moduleId]) {
                    AppState.progress.modules[moduleId] = { status: "em_andamento", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                }
                AppState.progress.modules[moduleId].lessonViewed = true;
                AppState.progress.modules[moduleId].lastAccess = new Date().toISOString();
                State.save();
            },
            saveDiagnosis(moduleId, results, strengths, weaknesses, recommendation) {
                AppState.diagnosis[moduleId] = {
                    doneAt: new Date().toISOString(),
                    results: results,
                    strengths: strengths,
                    weaknesses: weaknesses,
                    recommendation: recommendation
                };
                if (!AppState.progress.modules[moduleId]) {
                    AppState.progress.modules[moduleId] = { status: "diagnostico", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                }
                AppState.progress.modules[moduleId].diagnosisDone = true;
                AppState.progress.modules[moduleId].status = "em_andamento";
                State.save();
            },
            recordQuestionAnswer(questionId, userAnswer, correct, context = 'quiz') {
                const logEntry = {
                    questionId: questionId,
                    userAnswer: userAnswer,
                    correct: correct,
                    timestamp: new Date().toISOString(),
                    context: context
                };
                AppState.progress.questionLog.push(logEntry);
                AppState.progress.questionsAnswered++;
                if (correct) AppState.progress.questionsCorrect++;

                const question = Data.questions.find(q => q.id === questionId);
                if (question && question.moduleId) {
                    if (!AppState.progress.modules[question.moduleId]) {
                        AppState.progress.modules[question.moduleId] = { status: "em_andamento", diagnosisDone: false, lessonViewed: false, questionsAnswered: 0, questionsCorrect: 0, flashcardsStudied: 0, lastAccess: "" };
                    }
                    AppState.progress.modules[question.moduleId].questionsAnswered++;
                    if (correct) AppState.progress.modules[question.moduleId].questionsCorrect++;
                    AppState.progress.modules[question.moduleId].lastAccess = new Date().toISOString();
                }

                if (!correct && question) {
                    if (!AppState.errors[questionId]) {
                        AppState.errors[questionId] = {
                            questionId: questionId,
                            userAnswer: userAnswer,
                            correctAnswer: question.answer,
                            count: 1,
                            lastAttempt: new Date().toISOString(),
                            nextReview: new Date(Date.now() + 1 * 24 * 60 * 60 * 1000).toISOString(),
                            resolved: false
                        };
                    } else {
                        AppState.errors[questionId].count++;
                        AppState.errors[questionId].lastAttempt = new Date().toISOString();
                        AppState.errors[questionId].nextReview = new Date(Date.now() + 1 * 24 * 60 * 60 * 1000).toISOString();
                    }

                    AppState.reviews[questionId] = {
                        type: "error",
                        itemId: questionId,
                        intervalLevel: 1,
                        nextReview: new Date(Date.now() + 1 * 24 * 60 * 60 * 1000).toISOString(),
                        easeFactor: 2.0
                    };
                }

                State.save();
            }
        };

        const UI = {
            toast(msg) {
                const el = document.getElementById('toast');
                el.textContent = msg; el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 3000);
            },
            getPriorityBadge(p) {
                return { 'alta': '<span class="badge badge-alta">Alta</span>', 'media': '<span class="badge badge-media">Média</span>', 'baixa': '<span class="badge badge-baixa">Baixa</span>' }[p] || '';
            },
            renderDashboard() {
                const total = Data.modules.length;
                const studied = Object.keys(AppState.progress.modules).length;
                const diagDone = Object.keys(AppState.diagnosis).length;
                const acc = AppState.progress.questionsAnswered > 0 ? Math.round((AppState.progress.questionsCorrect / AppState.progress.questionsAnswered) * 100) : 0;
                const totalQuestions = Data.questions.length;
                const totalFlashcards = Data.flashcards.length;
                return `
                    <div class="card">
                        <h2>👋 Bem-vindo de volta!</h2>
                        <div class="stat-grid">
                            <div class="stat-box"><div class="stat-value">${studied}/${total}</div><div class="stat-label">Módulos Iniciados</div></div>
                            <div class="stat-box"><div class="stat-value">${diagDone}</div><div class="stat-label">Diagnósticos Feitos</div></div>
                            <div class="stat-box"><div class="stat-value">${acc}%</div><div class="stat-label">Taxa de Acerto</div></div>
                            <div class="stat-box"><div class="stat-value">${Object.keys(AppState.errors).length}</div><div class="stat-label">Erros</div></div>
                        </div>
                        <div class="stat-grid">
                            <div class="stat-box"><div class="stat-value">${totalQuestions}</div><div class="stat-label">Questões Disponíveis</div></div>
                            <div class="stat-box"><div class="stat-value">${totalFlashcards}</div><div class="stat-label">Flashcards</div></div>
                        </div>
                        <button class="btn btn-primary" onclick="Router.navigate('modules')">Continuar Estudando</button>
                    </div>
                    <div class="card"><h3>🚧 Fase 5</h3><p style="font-size:0.9rem;color:var(--text-muted);">Banco expandido: ${totalQuestions} questões didáticas + ${totalFlashcards} flashcards. Nenhuma questão real foi adicionada (verificação pendente).</p></div>`;
            },
            renderModules() {
                let html = `<div class="card"><h2>📚 Módulos</h2>`;
                Data.modules.forEach(mod => {
                    const p = AppState.progress.modules[mod.id];
                    const d = AppState.diagnosis[mod.id];
                    const qCount = Data.questions.filter(q => q.moduleId === mod.id).length;
                    let status = "⭕ Não iniciado";
                    if (d) status = "✅ Diagnóstico feito";
                    else if (p && p.lessonViewed) status = "📖 Aula visualizada";
                    else if (p) status = "⚠️ Em andamento";
                    html += `<div class="module-item" onclick="Router.navigate('topic','${mod.id}')">
                        <div><div style="font-weight:600;">${mod.id} — ${mod.title}</div><div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">${status} • ${qCount} questões</div></div>
                        ${UI.getPriorityBadge(mod.priority)}</div>`;
                });
                return html + `</div>`;
            },
            renderTopic(moduleId) {
                const mod = Data.modules.find(m => m.id === moduleId);
                if (!mod) return `<div class="card"><h2>Não encontrado</h2></div>`;
                const hasLesson = Data.lessons[moduleId];
                const hasDiag = Data.diagnosis[moduleId];
                const diagDone = AppState.diagnosis[moduleId];
                const moduleQuestions = Data.questions.filter(q => q.moduleId === moduleId);
                const moduleFlashcards = Data.flashcards.filter(f => f.moduleId === moduleId);
                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('modules')">← Voltar</button>
                        <h2>${mod.id} — ${mod.title}</h2>
                        <div style="margin:1rem 0;">${UI.getPriorityBadge(mod.priority)}</div>
                        ${diagDone ? `<div class="success-box">✅ Diagnóstico concluído em ${new Date(diagDone.doneAt).toLocaleDateString('pt-BR')}.</div>` : ''}
                        <div style="display:flex;flex-direction:column;gap:0.5rem;">
                            ${hasDiag ? `<button class="btn ${diagDone ? 'btn-outline' : 'btn-primary'}" onclick="Router.navigate('diagnosis','${moduleId}')">${diagDone ? '🔄 Refazer Diagnóstico' : '📝 Fazer Diagnóstico Inicial'}</button>` : ''}
                            ${hasLesson ? `<button class="btn btn-outline" onclick="Router.navigate('lesson','${moduleId}')">📖 Ler Aula Teórica</button>` : ''}
                            ${moduleQuestions.length > 0 ? `<button class="btn btn-primary" onclick="Router.navigate('quiz','${moduleId}')">⚔️ Praticar Questões (${moduleQuestions.length})</button>` : `<button class="btn btn-outline" disabled>⚔️ Questões em desenvolvimento</button>`}
                            ${moduleFlashcards.length > 0 ? `<button class="btn btn-outline" onclick="Router.navigate('flashcards','${moduleId}')">🎴 Estudar Flashcards (${moduleFlashcards.length})</button>` : ''}
                        </div>
                    </div>`;
            },
            renderLesson(moduleId) {
                const mod = Data.modules.find(m => m.id === moduleId);
                const lesson = Data.lessons[moduleId];
                if (!mod || !lesson) return `<div class="card"><h2>Aula não encontrada</h2></div>`;
                State.markLessonViewed(moduleId);
                const prereqs = lesson.prerequisites.length > 0 ? lesson.prerequisites.map(p => { const pm = Data.modules.find(m => m.id === p); return pm ? pm.title : p; }).join(", ") : "Nenhum.";
                return `
                    <div class="card">
                        <button class="btn btn-outline" style="width:auto;margin-bottom:1rem;" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button>
                        <h2>${mod.id} — ${mod.title}</h2>
                    </div>
                    <div class="card">
                        <div class="lesson-section"><h3>🎯 Objetivo</h3><p>${lesson.objective}</p></div>
                        <div class="lesson-section"><h3>📋 Pré-requisitos</h3><p>${prereqs}</p></div>
                        <div class="lesson-section"><h3>📖 Introdução</h3><p>${lesson.introduction}</p></div>
                        <div class="lesson-section"><h3>📘 Explicação Detalhada</h3><div>${lesson.detailed.replace(/\n/g,'<br>')}</div></div>

            renderDiagnosis(moduleId) {

                let questionHtml = '';
                if (q.type === 'multipla_escolha' || q.type === 'situacao') {
                    questionHtml = `${q.situation ? `<div class="diag-situation-context">📋 ${q.situation}</div>` : ''}<div class="diag-question-text">${q.statement}</div><div class="diag-alternatives" id="diag-alts">${q.alternatives.map(a => `<button class="diag-alt-btn" data-id="${a.id}" onclick="UI.selectDiagAlt('${a.id}')"><span class="diag-alt-letter">${a.id}</span><span>${a.text}</span></button>`).join('')}</div><div id="diag-feedback" class="diag-feedback"></div><button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">${step < total ? 'Próxima →' : 'Ver Resultado →'}</button>`;
                } else if (q.type === 'verdadeiro_falso') {
                    questionHtml = `<div class="diag-question-text">${q.statement}</div><div class="diag-vf-buttons" id="diag-vf-btns"><button class="diag-vf-btn" data-val="true" onclick="UI.selectDiagVF(true)">✅ VERDADEIRO</button><button class="diag-vf-btn" data-val="false" onclick="UI.selectDiagVF(false)">❌ FALSO</button></div><div id="diag-feedback" class="diag-feedback"></div><button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">${step < total ? 'Próxima →' : 'Ver Resultado →'}</button>`;
                } else if (q.type === 'autoavaliacao') {
                    questionHtml = `<div class="diag-question-text">${q.statement}</div><div class="diag-auto-buttons" id="diag-auto-btns"><button class="diag-auto-btn" onclick="UI.selectDiagAuto(true)">✅ Eu já sabia</button><button class="diag-auto-btn" onclick="UI.selectDiagAuto(false)">❌ Eu não sabia</button></div><button id="diag-next-btn" class="btn btn-primary hidden" style="margin-top:1rem;" onclick="UI.nextDiagStep()">${step < total ? 'Próxima →' : 'Ver Resultado →'}</button>`;
                }

            },
            selectDiagAlt(altId) {
                if (UI.diagState.showingFeedback) return;
                UI.diagState.showingFeedback = true;
                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                const isCorrect = altId === q.answer;
                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: isCorrect, userAnswer: altId };
                document.querySelectorAll('.diag-alt-btn').forEach(btn => { btn.style.pointerEvents = 'none'; if (btn.dataset.id === q.answer) btn.classList.add('correct'); else if (btn.dataset.id === altId && !isCorrect) btn.classList.add('wrong'); });
                const fb = document.getElementById('diag-feedback');
                fb.className = `diag-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                fb.innerHTML = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou.'}</strong><br>${q.explanation}`;
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },
            selectDiagVF(val) {
                if (UI.diagState.showingFeedback) return;
                UI.diagState.showingFeedback = true;
                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                const isCorrect = val === q.answer;
                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: isCorrect, userAnswer: val };
                document.querySelectorAll('.diag-vf-btn').forEach(btn => { btn.style.pointerEvents = 'none'; const btnVal = btn.dataset.val === 'true'; if (btnVal === q.answer) btn.classList.add('correct'); else if (btnVal === val && !isCorrect) btn.classList.add('wrong'); });
                const fb = document.getElementById('diag-feedback');
                fb.className = `diag-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                fb.innerHTML = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou.'}</strong><br>${q.explanation}`;
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },
            selectDiagAuto(knew) {
                const moduleId = UI.diagState.moduleId;
                const q = Data.diagnosis[moduleId].questions[UI.diagState.step];
                UI.diagState.answers[q.id] = { type: q.type, subtopic: q.subtopic, correct: null, selfKnown: knew };
                document.querySelectorAll('.diag-auto-btn').forEach(btn => { btn.style.pointerEvents = 'none'; });
                event.target.classList.add('selected');
                document.getElementById('diag-next-btn').classList.remove('hidden');
            },
            nextDiagStep() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                UI.diagState.step++;
                if (UI.diagState.step >= diag.questions.length) { UI.renderDiagResult(); } else { UI.renderDiagQuestion(); }
            },
            renderDiagResult() {
                const moduleId = UI.diagState.moduleId;
                const diag = Data.diagnosis[moduleId];
                const answers = UI.diagState.answers;
                const subtopics = {};
                let totalObjective = 0, correctObjective = 0, totalSelfKnown = 0, selfKnownCount = 0;
                Object.values(answers).forEach(a => {
                    if (!subtopics[a.subtopic]) { const q = diag.questions.find(qq => qq.subtopic === a.subtopic); subtopics[a.subtopic] = { name: q ? q.subtopicName : a.subtopic, total: 0, correct: 0, selfKnown: 0, selfTotal: 0 }; }
                    const st = subtopics[a.subtopic];
                    if (a.type === 'autoavaliacao') { st.selfTotal++; if (a.selfKnown) { st.selfKnown++; selfKnownCount++; } totalSelfKnown++; } else { st.total++; totalObjective++; if (a.correct) { st.correct++; correctObjective++; } }
                });
                const pct = totalObjective > 0 ? Math.round((correctObjective / totalObjective) * 100) : 0;
                const strengths = []; const weaknesses = [];
                Object.entries(subtopics).forEach(([key, st]) => { const stPct = st.total > 0 ? (st.correct / st.total) * 100 : (st.selfKnown > 0 ? 100 : 50); if (stPct >= 75) strengths.push(st.name); else if (stPct < 50) weaknesses.push(st.name); });
                let recommendation = '';
                if (pct >= 80 && weaknesses.length === 0) { recommendation = '🟢 Excelente! Pode avançar para a aula.'; } else if (pct >= 50) { recommendation = '🟡 Bom começo! Reforce os pontos fracos.'; } else { recommendation = '🔴 Este módulo precisa de atenção. Estude a aula teórica.'; }
                State.saveDiagnosis(moduleId, subtopics, strengths, weaknesses, recommendation);
                const scoreClass = pct >= 75 ? 'diag-score-good' : pct >= 50 ? 'diag-score-medium' : 'diag-score-bad';
                let html = `<div class="card"><h2>📊 Resultado do Diagnóstico</h2><p style="color:var(--text-muted);font-size:0.9rem;">${diag.title}</p></div><div class="diag-result-card"><div class="diag-result-header"><div><div style="font-size:0.85rem;color:var(--text-muted);">Desempenho</div><div style="font-size:1.5rem;font-weight:700;">${correctObjective}/${totalObjective} (${pct}%)</div></div><div class="diag-score-circle ${scoreClass}">${pct}%</div></div></div><div class="diag-result-card"><h3 style="margin-bottom:0.75rem;">💡 Recomendação</h3><p style="font-size:0.95rem;">${recommendation}</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;"><button class="btn btn-outline" onclick="Router.navigate('topic','${moduleId}')">← Voltar</button><button class="btn btn-primary" onclick="Router.navigate('lesson','${moduleId}')">📖 Ir para a Aula</button></div>`;
                document.getElementById('app-container').innerHTML = html;
                window.scrollTo(0, 0);
            },
            quizState: { moduleId: null, questions: [], currentIndex: 0, answered: false },

            applyQuizFilters() {

                const type = document.getElementById('quiz-filter-type').value;
                let filtered = Data.questions.filter(q => q.moduleId === moduleId);

                UI.quizState.answered = false;
                UI.renderQuizQuestion();

            renderQuizQuestion() {
                const q = UI.quizState.questions[UI.quizState.currentIndex];
                const total = UI.quizState.questions.length;
                const current = UI.quizState.currentIndex + 1;
                const moduleId = UI.quizState.moduleId;
                UI.quizState.answered = false;
                const typeBadge = q.type === 'REAL'

                document.getElementById('app-container').innerHTML = `
                    <div class="card">
                        <div class="quiz-header">
                            <button class="btn btn-outline" style="width:auto;padding:0.4rem 0.8rem;margin:0;" onclick="Router.navigate('topic','${moduleId}')">← Sair</button>

                        ${typeBadge}
                        <div class="quiz-statement">${q.statement}</div>

                        </div>
                    </div>`;
            },
            selectQuizAlt(altId) {
                if (UI.quizState.answered) return;
                UI.quizState.answered = true;
                const q = UI.quizState.questions[UI.quizState.currentIndex];
                const isCorrect = altId === q.answer;
                State.recordQuestionAnswer(q.id, altId, isCorrect, 'quiz');
                document.querySelectorAll('.quiz-alt-btn').forEach(btn => {
                    btn.classList.add('disabled');
                    if (btn.dataset.id === q.answer) btn.classList.add('correct');
                    else if (btn.dataset.id === altId && !isCorrect) btn.classList.add('wrong');
                });
                const fb = document.getElementById('quiz-feedback');
                fb.className = `quiz-feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
                let feedbackHtml = `<strong>${isCorrect ? '✅ Acertou!' : '❌ Errou. Resposta correta: ' + q.answer + '.'}</strong>`;
                if (q.explanation) {
                    feedbackHtml += `<div class="quiz-feedback-section"><strong>💡 Por que ${q.answer} está correta?</strong>${q.explanation.correct}</div>`;
                    if (!isCorrect && q.explanation.wrong) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>❌ Por que as outras estão erradas?</strong>`;
                        Object.entries(q.explanation.wrong).forEach(([alt, exp]) => {
                            feedbackHtml += `<div style="margin-top:0.25rem;"><strong>${alt}):</strong> ${exp}</div>`;
                        });
                        feedbackHtml += `</div>`;
                    }
                    if (q.explanation.concept) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>📚 Conceito:</strong> ${q.explanation.concept}</div>`;
                    }
                    if (q.explanation.trap) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>⚠️ Pegadinha:</strong> ${q.explanation.trap}</div>`;
                    }
                    if (q.explanation.examTip) {
                        feedbackHtml += `<div class="quiz-feedback-section"><strong>🎓 Dica:</strong> ${q.explanation.examTip}</div>`;
                    }
                }
                fb.innerHTML = feedbackHtml;
                document.getElementById('quiz-next-btn').classList.remove('hidden');
            },
            prevQuizQuestion() {
                if (UI.quizState.currentIndex > 0) {
                    UI.quizState.currentIndex--;
                    UI.renderQuizQuestion();
                }
            },
            nextQuizQuestion() {
                const total = UI.quizState.questions.length;
                if (UI.quizState.currentIndex < total - 1) {
                    UI.quizState.currentIndex++;
                    UI.renderQuizQuestion();
                } else {
                    UI.toast("Quiz finalizado!");
                    Router.navigate('topic', UI.quizState.moduleId);
                }
            },

                if (!vis) { el.classList.add('visible'); btn.classList.add('active'); }
            },
            toggleRecovery(id, btn) {
                const el = document.getElementById(id);
                el.classList.toggle('visible');
                btn.textContent = el.classList.contains('visible') ? 'Ocultar' : 'Revelar';
            },
            renderSettings() {
                return `
                    <div class="card">
                        <h2>⚙️ Configurações e Backup</h2>
                        <button class="btn btn-outline" onclick="Storage.exportData(AppState)">⬇️ Exportar Progresso</button>
                        <div class="file-input-wrapper"><button class="btn btn-outline">⬆️ Importar Progresso</button><input type="file" accept=".json" onchange="Storage.importData(this.files[0])"></div>
                        <h3 style="margin-top:1.5rem;color:var(--danger);">Zona de Perigo</h3>
                        <button class="btn btn-danger" onclick="App.resetData()">🗑️ Resetar Todos os Dados</button>
                    </div>
                    <div class="card"><h3>Sobre</h3><p style="font-size:0.85rem;color:var(--text-muted);"><strong>ADMIN-DIR</strong><br>Versão: 0.5 (Fase 5)<br>Single-File Offline<br><br>Banco: ${Data.questions.length} questões didáticas, ${Data.flashcards.length} flashcards.<br>Nenhuma questão real adicionada (verificação pendente).</p></div>`;
            }
        };

        const Router = {
            currentRoute: 'dashboard',
            navigate(route, param = null) {
                this.currentRoute = route;
                const container = document.getElementById('app-container');
                document.querySelectorAll('nav.bottom-nav button').forEach(btn => btn.classList.remove('active'));
                const navBtn = document.getElementById(`nav-${['topic','lesson','diagnosis','quiz','flashcards'].includes(route) ? 'modules' : route}`);
                if (navBtn) navBtn.classList.add('active');
                window.scrollTo(0, 0);
                switch(route) {
                    case 'dashboard': container.innerHTML = UI.renderDashboard(); break;
                    case 'modules': container.innerHTML = UI.renderModules(); break;
                    case 'topic': container.innerHTML = UI.renderTopic(param); break;
                    case 'lesson': container.innerHTML = UI.renderLesson(param); break;
                    case 'diagnosis': container.innerHTML = UI.renderDiagnosis(param); break;
                    case 'quiz': container.innerHTML = UI.renderQuiz(param); break;
                    case 'flashcards': container.innerHTML = UI.renderFlashcards(param); break;
                    case 'settings': container.innerHTML = UI.renderSettings(); break;
                    default: container.innerHTML = UI.renderDashboard();
                }
            }
        };

        const App = {
            init() {
                State.init();
                document.getElementById('app-version').textContent = `v${AppState.version}`;
                Router.navigate('dashboard');
                console.log("ADMIN-DIR v0.5 inicializado.");
            },
            resetData() { State.reset(); }
        };
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
